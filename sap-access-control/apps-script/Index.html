<style>
:root {
  color-scheme: light dark;

  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --uy: #2a78d6; --cl: #eb6834; --ar: #8a8983;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1a1a19; --surface-2: #232321; --page: #121416;
    --text: #fff; --text-2: #c3c2b7; --muted: #a09f98;
    --grid: #2c2c2a; --base: #383835; --border: rgba(255,255,255,.1);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --uy: #3987e5; --cl: #d95926; --ar: #8a8983;
  }
}
:root[data-theme="dark"] {
  --surface: #1a1a19; --surface-2: #232321; --page: #121416;
  --text: #fff; --text-2: #c3c2b7; --muted: #a09f98;
  --grid: #2c2c2a; --base: #383835; --border: rgba(255,255,255,.1);
  --accent: #3987e5; --accent-soft: rgba(57,135,229,.16);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --uy: #3987e5; --cl: #d95926; --ar: #8a8983;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }

nav.tabs button.activo { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.tabs button .paso { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; background: var(--surface-2); margin-right: 6px; }

main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 10px; }

.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }

.grid { display: grid; gap: 12px; }

.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.t2 { color: var(--text-2); }
.muted { color: var(--muted); }

a.link, button.link { color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }

.cajon-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.cajon { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--page); z-index: 21; overflow: auto; padding: 20px 16px; box-shadow: -8px 0 24px rgba(0,0,0,.2); }
dl.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 16px; margin: 0; }

<script>
'use strict';

// SAP Access Control | Scienza — versión HTML única.
// Funciona abriendo este archivo en el navegador o publicado con Apps Script
// (HtmlService). Los archivos se procesan en memoria en el navegador; solo
// la configuración del universo (reglas y decisiones) se recuerda en este
// navegador, y se puede exportar/importar como archivo.
// =============================================================================

// ---------------------------------------------------------------- utilidades
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (x) => Number(x).toLocaleString('es-UY');
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const hoyISO = () => new Date().toISOString().slice(0, 10);
const fmtFecha = (iso) => { if (!iso) return '—'; if (iso === '9999-12-31') return 'Sin límite'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const PAISES = { UY: 'Uruguay', CL: 'Chile', AR: 'Argentina', OTRO: 'Otro país' };

function guardarLocal(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* almacenamiento no disponible */ } }
function leerLocal(clave, defecto) { try { const v = localStorage.getItem(clave); return v ? JSON.parse(v) : defecto; } catch (e) { return defecto; } }

function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function descargarCsv(nombre, cab, filas) {
  const esc = (v) => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  descargar(nombre, '﻿' + [cab, ...filas].map((f) => f.map(esc).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

// ------------------------------------------------------- interpretación SAP
function iso(y, m, d) {
  if (y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const f = new Date(Date.UTC(y, m - 1, d));
  if (f.getUTCMonth() !== m - 1) return null;
  return `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
/** Devuelve {v: 'AAAA-MM-DD'|null, mal: bool}. Vacío y 00000000 = sin dato. */
function leerFecha(c, orden) {
  if (c == null) return { v: null, mal: false };
  if (c instanceof Date) return isNaN(c) ? { v: null, mal: true } : { v: iso(c.getFullYear(), c.getMonth() + 1, c.getDate()), mal: false };
  if (typeof c === 'number') {
    if (c === 0) return { v: null, mal: false };
    if (c >= 19000101 && c <= 99991231) { const s = String(Math.trunc(c)); const v = iso(+s.slice(0, 4), +s.slice(4, 6), +s.slice(6, 8)); return { v, mal: !v }; }
    if (c >= 1 && c <= 2958465) { const f = new Date(Math.round((c - 25569) * 86400000)); const v = iso(f.getUTCFullYear(), f.getUTCMonth() + 1, f.getUTCDate()); return { v, mal: !v }; }
    return { v: null, mal: true };
  }
  const s = String(c).trim();
  if (['', '0', '00000000', '00.00.0000', '00/00/0000', '0000-00-00'].includes(s)) return { v: null, mal: false };
  let m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if (m) { const v = iso(+m[1], +m[2], +m[3]); return { v, mal: !v }; }
  m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s);
  if (m) { const v = iso(+m[1], +m[2], +m[3]); return { v, mal: !v }; }
  m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/.exec(s);
  if (m) { const diaPrimero = s.includes('.') || orden !== 'MDY'; const v = diaPrimero ? iso(+m[3], +m[2], +m[1]) : iso(+m[3], +m[1], +m[2]); return { v, mal: !v }; }
  if (/^\d+(\.\d+)?$/.test(s)) return leerFecha(Number(s), orden);
  return { v: null, mal: true };
}
function ordenFechas(celdas) {
  let dmy = false, mdy = false;
  for (const c of celdas) {
    if (typeof c !== 'string') continue;
    const m = /^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/.exec(c.trim());
    if (!m) continue;
    if (+m[1] > 12) dmy = true;
    if (+m[2] > 12) mdy = true;
  }
  return { orden: mdy && !dmy ? 'MDY' : 'DMY', conflicto: dmy && mdy };
}
function leerHora(c) {
  if (c == null || c === '') return null;
  const f = (hh, mi, se) => (hh > 23 || mi > 59 || se > 59) ? null : [hh, mi, se].map((x) => String(x).padStart(2, '0')).join(':');
  if (typeof c === 'number') {
    if (c > 0 && c < 1) { const t = Math.round(c * 86400); return f(Math.floor(t / 3600), Math.floor(t % 3600 / 60), t % 60); }
    return leerHora(String(Math.trunc(c)).padStart(6, '0'));
  }
  const s = String(c).trim();
  let m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s);
  if (m) return f(+m[1], +m[2], +(m[3] || 0));
  m = /^(\d{2})(\d{2})(\d{2})$/.exec(s.padStart(6, '0'));
  return m ? f(+m[1], +m[2], +m[3]) : null;
}
const txt = (c) => c == null ? '' : String(c).trim();
const usuario = (c) => txt(c).toUpperCase();

const TIPOS = { A: 'Diálogo', B: 'Sistema', C: 'Comunicación', L: 'Referencia', S: 'Servicio' };
const BITS_UFLAG = [[32, 'Bloqueo global por administrador (CUA)'], [64, 'Bloqueo local por administrador'], [128, 'Bloqueo por intentos fallidos de contraseña']];
function motivosBloqueo(u) {
  if (!u) return [];
  const r = []; let resto = u;
  for (const [b, e] of BITS_UFLAG) if (u & b) { r.push(e); resto &= ~b; }
  if (resto) r.push(`Indicador no reconocido (${resto})`);
  return r;
}
function vigencia(desde, hasta, ref) {
  if (desde && desde > ref) return 'futura';
  if (hasta && hasta !== '9999-12-31' && hasta < ref) return 'vencida';
  return 'vigente';
}
function leerPaises(c) {
  const s = norm(c).toUpperCase();
  if (!s) return [];
  if (/AMBOS|UY CL|CL UY|UY Y CL/.test(s)) return ['UY', 'CL'];
  const r = [];
  if (/\bUY\b|URUGUAY|\bURY\b/.test(s)) r.push('UY');
  if (/\bCL\b|CHILE|\bCHL\b/.test(s)) r.push('CL');
  if (/\bAR\b|ARGENTINA|\bARG\b/.test(s)) r.push('AR');
  return r;
}

// ------------------------------------------------------------------ fuentes

// Perfiles generados por PFCG a partir de roles: T-xxNNNN. El resto se asignó directamente.

// Parámetros de usuario que identifican estructura organizativa (pista de país).
const PARAMS_ORG = { BUK: 'Sociedad', VKO: 'Org. de ventas', VTW: 'Canal', SPA: 'Sector', WRK: 'Centro', LAG: 'Almacén', EKO: 'Org. de compras', EKG: 'Grupo de compras', CAC: 'Sociedad CO', KOK: 'Sociedad CO', GSB: 'División', PRC: 'Centro de beneficio', VST: 'Puesto de expedición', VKB: 'Oficina de ventas', '8BU': 'Sociedad (otro)' };

// Incluye las etiquetas en español de SE16N: "Clave acceso inicial" (BCODE/OCOD*),
// "Val.ctrl.clv.acc.(SHA1, 160 bit)" (PASSCODE), "Val.ctrl.clv.acc." (PWDSALTEDHASH)…
const esSensible = (enc) => { const x = norm(enc); return SENSIBLES.has(x) || /contrasena|password|passwort|kennwort|hash|pwd|sha1|clave acceso|clave de acceso|clv acc|codigo de clave|cod clv/.test(x); };
function sugerirCampo(fuente, enc) { const x = norm(enc); const c = FUENTES[fuente].campos.find((c) => c[3].includes(x)); return c ? c[0] : null; }
function puntaje(fuente, fila) { return new Set(fila.map((c) => sugerirCampo(fuente, txt(c))).filter(Boolean)).size; }

// ------------------------------------------------------------------ lectura
async function sha256(buf) {
  if (!(window.crypto && crypto.subtle)) return 'no disponible';
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function decodificar(buf) {
  try { return { t: new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''), cod: 'UTF-8' }; }
  catch (e) { return { t: new TextDecoder('windows-1252').decode(buf), cod: 'Windows-1252' }; }
}
function leerTexto(t) {
  const lineas = t.split(/\r?\n/).filter((l) => l.trim() && !/^[-|\s]+$/.test(l)).slice(0, 30);
  let delim = ',', mejor = -1;
  for (const d of ['\t', ';', '|', ',']) {
    const cs = lineas.map((l) => l.split(d).length - 1).filter((c) => c > 0);
    if (!cs.length) continue;
    const frec = {}; cs.forEach((c) => frec[c] = (frec[c] || 0) + 1);
    const moda = +Object.keys(frec).sort((a, b) => frec[b] - frec[a])[0];
    const p = frec[moda] * 100 + moda;
    if (p > mejor) { mejor = p; delim = d; }
  }
  let filas = Papa.parse(t, { delimiter: delim, skipEmptyLines: true }).data.filter((f) => !f.every((c) => /^[-\s]*$/.test(c)));
  if (delim === '|') filas = filas.map((f) => { let i = 0, j = f.length; if (txt(f[0]) === '') i = 1; if (j > i && txt(f[j - 1]) === '') j--; return f.slice(i, j); });
  return filas.map((f) => f.map((c) => c.trim()));
}
async function leerArchivo(file) {
  const buf = await file.arrayBuffer();
  const hash = await sha256(buf);
  const nombre = file.name.toLowerCase();
  const adv = [];
  let hojas;
  if (/\.(xlsx|xlsm|xls)$/.test(nombre)) {
    // raw: las fechas llegan como número de serie de Excel y se interpretan sin depender de la zona horaria.
    const wb = XLSX.read(buf, { type: 'array', cellDates: false });
    hojas = wb.SheetNames.map((s) => ({ nombre: s, filas: XLSX.utils.sheet_to_json(wb.Sheets[s], { header: 1, raw: true, defval: null }) }));
  } else {
    const { t, cod } = decodificar(buf);
    if (cod !== 'UTF-8') adv.push(`Texto leído como ${cod}.`);
    hojas = [{ nombre: 'Texto', filas: leerTexto(t) }];
  }
  return { nombre: file.name, tamano: file.size, sha: hash, hojas, adv };
}
function filaEncabezado(fuente, filas) {
  let mejor = -1, p = 0;
  for (let i = 0; i < Math.min(filas.length, 25); i++) { const q = puntaje(fuente, filas[i] || []); if (q > p) { p = q; mejor = i; } }
  return mejor >= 0 ? mejor : Math.max(0, filas.findIndex((f) => (f || []).some((c) => txt(c) !== '')));
}
function armarTabla(hoja, fe) {
  const vistos = {};
  const enc = (hoja.filas[fe] || []).map((c, i) => { let x = txt(c) || `Columna ${i + 1}`; vistos[x] = (vistos[x] || 0) + 1; return vistos[x] > 1 ? `${x} (${vistos[x]})` : x; });
  const filas = hoja.filas.slice(fe + 1).filter((f) => f && f.some((c) => txt(c) !== ''));
  return { enc, filas, fe };
}
function mapeoSugerido(fuente, enc) {
  const m = {}, usados = new Set();
  for (const e of enc) { if (esSensible(e)) continue; const c = sugerirCampo(fuente, e); if (c && !usados.has(c)) { m[e] = c; usados.add(c); } }
  return m;
}

/** Convierte filas en registros. No toca el estado global. */
function procesar(fuente, tabla, mapeo) {
  const idx = {};
  tabla.enc.forEach((e, i) => { if (!esSensible(e) && mapeo[e]) idx[mapeo[e]] = i; });
  for (const [c, et, req] of FUENTES[fuente].campos) if (req && idx[c] === undefined) throw new Error(`Falta indicar la columna obligatoria: ${et}.`);
  const val = (f, c) => idx[c] === undefined ? null : f[idx[c]];
  const sensibles = tabla.enc.filter(esSensible);
  const adv = [];
  if (sensibles.length) adv.push(`El archivo traía columnas de credenciales (${sensibles.join(', ')}). Se descartaron y no se usan. Conviene borrar el archivo original y re-exportar sin esos campos.`);
  const ordenes = {}, malas = {};
  const fechasDe = { USR02: ['gltgv', 'gltgb', 'trdat', 'erdat'], AGR_USERS: ['desde', 'hasta'] }[fuente] || [];
  for (const c of fechasDe) if (idx[c] !== undefined) { const o = ordenFechas(tabla.filas.map((f) => val(f, c))); ordenes[c] = o.orden; if (o.conflicto) adv.push(`La columna ${c.toUpperCase()} mezcla día/mes y mes/día; se tomó día/mes.`); }
  const fecha = (f, c) => { const r = leerFecha(val(f, c), ordenes[c]); if (r.mal) malas[c] = (malas[c] || 0) + 1; return r.v; };
  const regs = [], claves = new Set(), rech = [];
  let duplicadas = 0, numericos = 0;
  tabla.filas.forEach((f, i) => {
    const nf = tabla.fe + 2 + i;
    if (fuente === 'USR02') {
      const bname = usuario(val(f, 'bname'));
      if (!bname) return rech.push(`Fila ${nf}: BNAME vacío`);
      if (claves.has(bname)) return duplicadas++;
      claves.add(bname);
      if (/^\d+$/.test(bname)) numericos++;
      const uf = txt(val(f, 'uflag'));
      const trdat = fecha(f, 'trdat');
      const ustypTxt = txt(val(f, 'ustyp')).toUpperCase();
      const mt = /^([A-Z])(\s|$)/.exec(ustypTxt); // "A Diálogo" → A
      regs.push({ bname, ustyp: mt ? mt[1] : ustypTxt, erdat: fecha(f, 'erdat'), uflag: /^\d+$/.test(uf) ? +uf : (uf ? null : 0), uflagTxt: uf,
        gltgv: fecha(f, 'gltgv'), gltgb: fecha(f, 'gltgb'), trdat, ltime: trdat ? leerHora(val(f, 'ltime')) : null, clase: txt(val(f, 'clase')).toUpperCase() });
    } else if (fuente === 'AGR_USERS') {

      const desde = fecha(f, 'desde'), hasta = fecha(f, 'hasta');
      const k = `${uname}|${agr}|${desde}|${hasta}`;

      if (!agr || !varbl || !low) return rech.push(`Fila ${nf}: rol, campo o valor vacío`);
      const k = `${agr}|${varbl}|${low}|${txt(val(f, 'high'))}`;
      if (claves.has(k)) return duplicadas++;

    } else if (fuente === 'USR05') {
      const bname = usuario(val(f, 'bname')), parid = txt(val(f, 'parid')).toUpperCase(), parva = txt(val(f, 'parva')).toUpperCase();

      const k = `${bname}|${perfil}`;
      if (claves.has(k)) return duplicadas++;

    } else if (fuente === 'USR21') {

}

// --------------------------------------------------------- cálculo universo
function tokensDe(agr) { return agr.split(/[^A-Z0-9]+/).filter((t) => t.length >= 2 && !/^\d+$/.test(t)); }

function calcular() {
  const ref = S.fechaRef;
  const usr = S.datos.USR02 ? S.datos.USR02.regs : [];
  const asig = S.datos.AGR_USERS ? S.datos.AGR_USERS.regs : [];
  const org = S.datos.AGR_1252 ? S.datos.AGR_1252.regs : [];
  const refl = S.datos.REF ? S.datos.REF.regs : [];
  const regs = (f) => (S.datos[f] ? S.datos[f].regs : []);
  const reglas = S.conf.reglas;

  // Nombre de cada usuario: USR21 (usuario → persona) + ADRP (persona → nombre)
  const nombrePorPers = {};
  regs('ADRP').forEach((p) => (nombrePorPers[p.pers] = p.nombre));
  const nombres = {};
  regs('USR21').forEach((u) => { if (nombrePorPers[u.pers]) nombres[u.bname] = nombrePorPers[u.pers]; });
  // Perfiles (UST04) y parámetros organizativos (USR05)
  const perfiles = {};
  regs('UST04').forEach((x) => (perfiles[x.bname] = perfiles[x.bname] || []).push(x.perfil));
  const params = {};
  regs('USR05').forEach((x) => { if (PARAMS_ORG[x.parid]) (params[x.bname] = params[x.bname] || []).push(x); });

  // Índices de reglas
  const rTok = {}, rCont = [], rClase = {}, rOrg = {}, rParam = {};
  for (const r of reglas) {
    if (r.tipo === 'token') rTok[r.valor] = r.pais;
    else if (r.tipo === 'contiene') rCont.push(r);
    else if (r.tipo === 'clase') rClase[r.valor] = r.pais;
    else if (r.tipo === 'org') rOrg[`${r.campo}=${r.valor}`] = r.pais;
    else if (r.tipo === 'param') rParam[`${r.campo}=${r.valor}`] = r.pais;
  }
  const orgPorRol = {};
  for (const o of org) (orgPorRol[o.agr] = orgPorRol[o.agr] || []).push(o);

  // País de un rol. El nombre del rol manda sobre los niveles organizativos.
  // Un rol solo es pista si apunta a UN país: los roles multipaís (p. ej. una
  // org. de compras de Argentina y otra de Uruguay) quedan neutros.
  const cachePais = {};
  const paisesDeRol = (agr) => {
    if (cachePais[agr]) return cachePais[agr];
    const porNombre = new Set(), porOrg = new Set(), motivos = [];
    for (const t of tokensDe(agr)) if (rTok[t]) { porNombre.add(rTok[t]); motivos.push(`nombre: ${t}`); }
    for (const r of rCont) if (agr.includes(r.valor)) { porNombre.add(r.pais); motivos.push(`nombre contiene ${r.valor}`); }
    for (const o of orgPorRol[agr] || []) { const k = `${o.varbl}=${o.low}`; if (rOrg[k]) { porOrg.add(rOrg[k]); motivos.push(k); } }
    const base = porNombre.size ? porNombre : porOrg;
    const lista = [...base].sort();
    return (cachePais[agr] = { paises: lista.length === 1 ? lista : [], multi: lista.length > 1 ? lista : [], fuente: porNombre.size ? 'nombre' : porOrg.size ? 'org' : '', motivos });
  };
  const tagsRol = (agr) => { const x = paisesDeRol(agr); return x.paises.length ? x.paises.map(tagPais).join(' ') : x.multi.length ? `<span class="tag" title="${h(x.motivos.slice(0, 10).join(', '))}"><i></i>Multipaís ${x.multi.join('+')}</span>` : '<span class="muted">—</span>'; };

  const refPorUsuario = {};
  for (const r of refl) refPorUsuario[r.usuario] = r;

  const asigPorUsuario = {};
  for (const a of asig) {
    const e = vigencia(a.desde, a.hasta, ref);
    const x = Object.assign({}, a, { estado: e, porVencer: e === 'vigente' && a.hasta && a.hasta !== '9999-12-31' && dias(ref, a.hasta) <= 30 });
    (asigPorUsuario[a.uname] = asigPorUsuario[a.uname] || []).push(x);
  }

  const cuentas = usr.map((u) => {
    const roles = (asigPorUsuario[u.bname] || []).sort((a, b) => a.agr.localeCompare(b.agr));
    const vig = roles.filter((r) => r.estado === 'vigente');
    const base = vig.length ? vig : roles;
    const ev = { UY: 0, CL: 0, AR: 0, OTRO: 0 }, motivosEv = {};

    }
    if (rClase[u.clase]) { ev[rClase[u.clase]] += 1; (motivosEv[rClase[u.clase]] = motivosEv[rClase[u.clase]] || []).push(`grupo ${u.clase}`); }
    for (const x of params[u.bname] || []) { const c = rParam[`${x.parid}=${x.parva}`]; if (c) { ev[c] += 1; (motivosEv[c] = motivosEv[c] || []).push(`parámetro ${x.parid}=${x.parva}`); } }
    const susPerfiles = perfiles[u.bname] || [];
    const perfilesDirectos = susPerfiles.filter((p) => !esPerfilGenerado(p));
    const enRef = refPorUsuario[u.bname];
    const bloqueada = !!u.uflag;
    const vigCuenta = vigencia(u.gltgv, u.gltgb, ref);
    const tecnica = u.ustyp !== '' && u.ustyp !== 'A';

    // Sugerencia
    let sug, motivo;
    const local = ev.UY + ev.CL > 0, externa = ev.AR + ev.OTRO > 0;
    if (S.conf.excluirTecnicas && tecnica) { sug = 'excluir'; motivo = `Cuenta técnica (${TIPOS[u.ustyp] || u.ustyp})`; }
    else if (enRef) { sug = 'incluir'; motivo = 'Está en la lista de referencia'; }
    else if (local && !externa) { sug = 'incluir'; motivo = 'Solo pistas de UY/CL'; }
    else if (!local && externa) { sug = 'excluir'; motivo = 'Solo pistas de otros países'; }
    else if (local && externa) { sug = 'revisar'; motivo = 'Pistas mixtas'; }
    else { sug = 'revisar'; motivo = roles.length ? 'Sin pistas de país' : 'Sin roles asignados'; }

    const dec = S.conf.decisiones[u.bname];
    const final = dec && dec.d ? dec.d : sug;
    let paisSug = [];
    if (enRef && enRef.paises.length) paisSug = enRef.paises.filter((p) => p === 'UY' || p === 'CL');
    else paisSug = ['UY', 'CL'].filter((p) => ev[p] > 0);
    const pais = dec && dec.pais ? dec.pais.split('+') : paisSug;

    return {
      ...u, roles, vigentes: [...new Set(vig.map((r) => r.agr))], ev, motivosEv, enRef, tecnica,
      nombre: nombres[u.bname] || (enRef ? enRef.nombre : ''), perfilesDirectos, perfilesGenerados: susPerfiles.length - perfilesDirectos.length,
      critico: perfilesDirectos.some((p) => PERFILES_CRITICOS.has(p)), params: params[u.bname] || [],
      bloqueada, motivos: motivosBloqueo(u.uflag), vigCuenta, utilizable: !bloqueada && vigCuenta === 'vigente',
      diasSinAcceso: u.trdat ? dias(u.trdat, ref) : null,
      multipais, sug, motivo, manual: !!(dec && dec.d), final, pais, nota: dec ? dec.nota || '' : '',
    };
  });
  const porNombre = {};
  cuentas.forEach((c) => porNombre[c.bname] = c);
  const universo = cuentas.filter((c) => c.final === 'incluir');
  const enU = new Set(universo.map((c) => c.bname));

  // Tokens de roles (para descubrir convenciones de nombres)
  const tok = {};
  for (const a of asig) {
    for (const t of tokensDe(a.agr)) {
      const x = tok[t] = tok[t] || { token: t, roles: new Set(), usuarios: new Set() };
      x.roles.add(a.agr); x.usuarios.add(a.uname);
    }
  }
  const tokens = Object.values(tok).map((x) => ({ token: x.token, roles: x.roles.size, usuarios: x.usuarios.size, ejemplos: [...x.roles].slice(0, 3), pais: rTok[x.token] || '' }))
    .sort((a, b) => b.usuarios - a.usuarios || a.token.localeCompare(b.token));
  const clases = {};
  usr.forEach((u) => { const k = u.clase || ''; clases[k] = (clases[k] || 0) + 1; });
  const paramVals = {};
  for (const x of regs('USR05')) {
    if (!PARAMS_ORG[x.parid]) continue;
    const k = `${x.parid}=${x.parva}`;
    const y = paramVals[k] = paramVals[k] || { campo: x.parid, valor: x.parva, usuarios: 0, pais: rParam[k] || '' };
    y.usuarios++;
  }
  const orgVals = {};
  for (const o of org) {
    const k = `${o.varbl}=${o.low}`;
    const x = orgVals[k] = orgVals[k] || { campo: o.varbl, valor: o.low, roles: new Set() };
    x.roles.add(o.agr);
  }

  // Roles: vista inversa
  const roles = {};
  for (const c of cuentas) for (const r of c.roles) {
    if (r.estado !== 'vigente') continue;
    const x = roles[r.agr] = roles[r.agr] || { agr: r.agr, enUniverso: 0, uy: 0, cl: 0, fuera: 0, usuarios: [] };
    if (enU.has(c.bname)) { x.enUniverso++; x.usuarios.push(c.bname); if (c.pais.includes('UY')) x.uy++; if (c.pais.includes('CL')) x.cl++; }
    else x.fuera++;
  }
  const huerfanas = [...new Set(asig.filter((a) => !porNombre[a.uname]).map((a) => a.uname))];
  S.calc = { tagsRol, cuentas, porNombre, universo, tokens, clases, orgVals: Object.values(orgVals), paramVals: Object.values(paramVals).sort((a, b) => b.usuarios - a.usuarios), roles: Object.values(roles).filter((r) => r.enUniverso > 0), rolesTodos: roles, huerfanas, paisesDeRol };
}

// Sugerencias iniciales evidentes (se pueden quitar).
function aplicarSugeridas() {
  if (S.conf.sugeridasAplicadas || !S.datos.AGR_USERS) return;
  const conocidos = { UY: 'UY', URU: 'UY', URY: 'UY', URUGUAY: 'UY', CL: 'CL', CHL: 'CL', CHILE: 'CL', AR: 'AR', ARG: 'AR', ARGENTINA: 'AR' };
  const presentes = new Set();
  for (const a of S.datos.AGR_USERS.regs) tokensDe(a.agr).forEach((t) => presentes.add(t));
  // También prefijos de roles de cliente: ZUY, YCL, ZAR…
  for (const t of presentes) { const m = /^[ZY](UY|CL|AR)$/.exec(t); if (m) conocidos[t] = m[1]; }
  for (const [t, p] of Object.entries(conocidos)) if (presentes.has(t) && !S.conf.reglas.some((r) => r.tipo === 'token' && r.valor === t)) S.conf.reglas.push({ tipo: 'token', valor: t, pais: p, auto: true });
  S.conf.sugeridasAplicadas = true;
  guardarConf();
}

// Campos organizativos donde el prefijo del valor suele indicar el país (UY10, CL01, AR01…).
const CAMPOS_SOCIEDAD = new Set(['BUKRS', 'VKORG', 'KOKRS', 'EKORG', 'KKBER', 'VKBUR', 'VKGRP', 'BUK', 'VKO', 'CAC', 'EKO', 'KOK', '8BU']);
function aplicarSugeridasOrg() {
  const pais = (v) => (/^UY/.test(v) ? 'UY' : /^CL/.test(v) ? 'CL' : /^AR/.test(v) ? 'AR' : '');
  const agregar = (tipo, campo, valor) => {
    const p = pais(valor);
    if (!p || !CAMPOS_SOCIEDAD.has(campo)) return;
    if (S.conf.reglas.some((r) => r.tipo === tipo && r.campo === campo && r.valor === valor)) return;
    S.conf.reglas.push({ tipo, campo, valor, pais: p, auto: true });
  };
  if (S.datos.AGR_1252 && !S.conf.sugeridasOrg) { S.datos.AGR_1252.regs.forEach((o) => agregar('org', o.varbl, o.low)); S.conf.sugeridasOrg = true; }
  if (S.datos.USR05 && !S.conf.sugeridasParam) { S.datos.USR05.regs.forEach((x) => agregar('param', x.parid, x.parva)); S.conf.sugeridasParam = true; }
  guardarConf();
}

function setRegla(tipo, valor, pais, campo) {
  S.conf.reglas = S.conf.reglas.filter((r) => !(r.tipo === tipo && r.valor === valor && (r.campo || '') === (campo || '')));
  if (pais) S.conf.reglas.push({ tipo, valor, pais, campo: campo || undefined });
  guardarConf();
  recalcular();
}

const tagPais = (p) => `<span class="tag ${p.toLowerCase()}"><i></i>${p}</span>`;
const tagSug = { incluir: '<span class="tag ok"><i></i>Incluir</span>', excluir: '<span class="tag"><i></i>Excluir</span>', revisar: '<span class="tag warn"><i></i>Revisar</span>' };
function tagEstado(c) {
  if (c.bloqueada) return `<span class="tag crit" title="${h(c.motivos.join(' · '))}"><i></i>Bloqueada</span>`;
  if (c.vigCuenta !== 'vigente') return `<span class="tag warn"><i></i>Validez ${c.vigCuenta}</span>`;
  return '<span class="tag ok"><i></i>Utilizable</span>';
}
function evidencia(c) {
  const p = Object.entries(c.ev).filter(([, v]) => v > 0);
  const t = p.map(([k, v]) => `<span class="tag ${k.toLowerCase()}" title="${h((c.motivosEv[k] || []).slice(0, 8).join(', '))}"><i></i>${k} ${v}</span>`).join(' ');
  const m = c.multipais ? ` <span class="tag" title="Roles que apuntan a más de un país: no cuentan como pista"><i></i>${c.multipais} multipaís</span>` : '';
  return (c.enRef ? '<span class="tag acc"><i></i>Lista ref.</span> ' : '') + (t || (m ? '' : '<span class="muted">—</span>')) + m;
}
function stat(e, v, d, accion) {
  const cont = `<div class="e">${h(e)}</div><div class="v">${typeof v === 'number' ? n(v) : h(v)}</div>${d ? `<div class="d">${h(d)}</div>` : ''}`;
  return accion ? `<button class="stat" data-accion="${accion}">${cont}</button>` : `<div class="stat">${cont}</div>`;
}
function barra(partes) {
  const tot = partes.reduce((a, p) => a + p[1], 0) || 1;
  return `<div class="barra" role="img" aria-label="${h(partes.map((p) => `${p[0]}: ${p[1]}`).join(', '))}">${partes.filter((p) => p[1] > 0).map((p) => `<div title="${h(p[0])}: ${n(p[1])}" style="width:${p[1] / tot * 100}%;background:${p[2]}"></div>`).join('')}</div>
  <div class="leyenda">${partes.map((p) => `<span style="--c:${p[2]}">${h(p[0])}: <b style="color:var(--text)">${n(p[1])}</b></span>`).join('')}</div>`;
}
function paginar(lista, pag, por) {
  const total = Math.max(1, Math.ceil(lista.length / por));
  const p = Math.min(pag, total - 1);
  return { items: lista.slice(p * por, (p + 1) * por), p, total };
}
function pie(lista, pg, clave) {
  return `<div class="pag"><span>${n(lista.length)} fila(s)</span>${pg.total > 1 ? `<span class="fila"><button class="btn mini" data-pag="${clave}" data-dir="-1" ${pg.p === 0 ? 'disabled' : ''}>Anterior</button> Página ${pg.p + 1} de ${pg.total} <button class="btn mini" data-pag="${clave}" data-dir="1" ${pg.p >= pg.total - 1 ? 'disabled' : ''}>Siguiente</button></span>` : ''}</div>`;
}

    ${contiene.length ? `<ul style="margin:8px 0 0;padding-left:18px">${contiene.map((r) => `<li><span class="mono">${h(r.valor)}</span> → ${PAISES[r.pais]} · <button class="link" data-accion="quitar-contiene" data-valor="${h(r.valor)}">quitar</button> <span class="muted peq">(${n(Object.keys(S.calc.rolesTodos).filter((a) => a.includes(r.valor)).length)} roles con asignaciones vigentes)</span></li>`).join('')}</ul>` : ''}
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-h"><h2>B. Grupo de usuarios (CLASS)</h2></div>
      <p class="t2 peq" style="margin-top:0">Si los grupos de USR02 distinguen países, asignalos.</p>
      <div class="tabla-wrap" style="max-height:320px"><table class="t"><thead><tr><th>Grupo</th><th class="num">Cuentas</th><th>País</th></tr></thead><tbody>
      ${Object.entries(C.clases).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td class="mono">${h(k) || '<span class="muted">(vacío)</span>'}</td><td class="num">${n(v)}</td><td>${k ? selPais(`data-regla="clase" data-valor="${h(k)}"`, (S.conf.reglas.find((r) => r.tipo === 'clase' && r.valor === k) || {}).pais) : ''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>C. Niveles organizativos y parámetros</h2></div>
      <h3 style="margin-top:0">C. Niveles organizativos de roles (AGR_1252)</h3>
      ${S.datos.AGR_1252 ? `
        <p class="t2 peq" style="margin-top:0">Asigná país a las sociedades (BUKRS), centros, organizaciones de ventas, etc. Es la pista más confiable.</p>
        <select class="campo" id="orgCampo" style="margin-bottom:8px"><option value="">Todos los campos</option>${camposOrg.map((c) => `<option ${U.orgCampo === c ? 'selected' : ''}>${h(c)}</option>`).join('')}</select>
        <div class="tabla-wrap" style="max-height:280px"><table class="t"><thead><tr><th>Campo</th><th>Valor</th><th class="num">Roles</th><th>País</th></tr></thead><tbody>
        ${orgs.sort((a, b) => b.roles.size - a.roles.size).slice(0, 300).map((o) => `<tr><td class="mono">${h(o.campo)}</td><td class="mono">${h(o.valor)}</td><td class="num">${n(o.roles.size)}</td><td>${selPais(`data-regla="org" data-campo="${h(o.campo)}" data-valor="${h(o.valor)}"`, reglaOrg(o))}</td></tr>`).join('')}
        </tbody></table></div>`
      : `<p class="t2" style="margin-top:0">Opcional. Si cargás <b>AGR_1252</b> en el paso 1, vas a poder indicar qué sociedades, centros u organizaciones corresponden a cada país, y la app deduce el país de cada rol a partir de esos valores.</p>`}
      <h3>D. Parámetros de usuario (USR05)</h3>
      ${S.datos.USR05 ? (C.paramVals.length ? `
        <p class="t2 peq" style="margin-top:0">Valores organizativos predeterminados en el perfil de cada usuario (SU01 → Parámetros).</p>
        <div class="tabla-wrap" style="max-height:240px"><table class="t"><thead><tr><th>Parámetro</th><th>Valor</th><th class="num">Usuarios</th><th>País</th></tr></thead><tbody>
        ${C.paramVals.map((x) => `<tr><td><span class="mono">${h(x.campo)}</span> <span class="peq muted">${h(PARAMS_ORG[x.campo])}</span></td><td class="mono">${h(x.valor)}</td><td class="num">${n(x.usuarios)}</td><td>${selPais(`data-regla="param" data-campo="${h(x.campo)}" data-valor="${h(x.valor)}"`, x.pais)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="t2 peq" style="margin:0">USR05 no tiene parámetros organizativos (BUK, VKO, WRK…).</p>')
      : '<p class="t2 peq" style="margin:0">Opcional: cargá USR05 en el paso 1.</p>'}
      <h3>E. Lista de referencia</h3>
      <p class="t2 peq" style="margin:0">${S.datos.REF ? `${n(S.datos.REF.regs.length)} usuarios en la lista; cuentan como "incluir".` : 'Opcional: planilla de RR. HH. o lista propia de usuarios UY/CL (paso 1).'}</p>
      <h3>Opciones</h3>
      <label class="fila"><input type="checkbox" id="excluirTecnicas" ${S.conf.excluirTecnicas ? 'checked' : ''}> Sugerir excluir cuentas técnicas (tipo B, C, L, S)</label>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Resultado y revisión cuenta por cuenta</h2>
      <div class="fila">
        <button class="btn" data-accion="exportar-universo">Exportar universo (CSV)</button>
        <label class="btn">Importar universo<input type="file" class="oculto" id="importarUniverso" accept=".csv,.txt"></label>
        <button class="btn" data-accion="exportar-conf">Exportar configuración</button>
        <label class="btn">Importar configuración<input type="file" class="oculto" id="importarConf" accept=".json"></label>
      </div>
    </div>
    <p class="t2 peq" style="margin-top:0">La primera vez podés recorrer las cuentas "por revisar" y decidir una por una; las decisiones manuales siempre ganan a la sugerencia. Exportá el universo para reutilizarlo en la próxima extracción: las cuentas nuevas aparecerán como pendientes.</p>
    <div class="fila" style="margin-bottom:8px">
      <select class="campo" id="uFiltro">
        ${[['pendientes', 'Por revisar'], ['incluidos', 'En el universo'], ['sinpais', 'En el universo sin país'], ['excluidos', 'Excluidas'], ['manuales', 'Decididas a mano'], ['todas', 'Todas']].map(([k, v]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <input class="campo" id="uTexto" placeholder="Buscar usuario, nombre, grupo, rol…" value="${h(U.uTexto)}">
      <span class="t2 peq">${n(U.uSel.size)} seleccionada(s)</span>
      <button class="btn mini" data-accion="sel-pagina">Seleccionar página</button>
      <button class="btn mini" data-accion="sel-filtro">Seleccionar todo el filtro (${n(lista.length)})</button>
      <button class="btn mini" data-accion="sel-ninguna">Limpiar selección</button>
    </div>
    <div class="fila" style="margin-bottom:8px">
      <span class="peq t2">Con las seleccionadas:</span>
      <button class="btn mini" data-masivo="incluir">Incluir</button>
      <button class="btn mini" data-masivo="incluir" data-pais="UY">Incluir como UY</button>
      <button class="btn mini" data-masivo="incluir" data-pais="CL">Incluir como CL</button>
      <button class="btn mini" data-masivo="incluir" data-pais="UY+CL">Incluir como UY+CL</button>
      <button class="btn mini" data-masivo="excluir">Excluir</button>
      <button class="btn mini" data-masivo="">Volver a la sugerencia</button>
    </div>
    <div class="tabla-wrap"><table class="t"><thead><tr><th></th><th>Usuario</th><th>Tipo</th><th>Estado</th><th>Grupo</th><th class="num">Roles vig.</th><th>Pistas</th><th>Sugerencia</th><th>Decisión</th><th>País</th></tr></thead><tbody>
    ${pgU.items.map((c) => `<tr>
      <td><input type="checkbox" data-sel="${h(c.bname)}" ${U.uSel.has(c.bname) ? 'checked' : ''} aria-label="Seleccionar ${h(c.bname)}"></td>
      <td><button class="link mono" data-ficha="${h(c.bname)}">${h(c.bname)}</button>${c.nombre ? `<div class="peq t2">${h(c.nombre)}</div>` : ''}</td>
      <td>${h(TIPOS[c.ustyp] || c.ustyp || '—')}</td>
      <td>${tagEstado(c)}</td>
      <td class="mono">${h(c.clase) || '—'}</td>
      <td class="num">${n(c.vigentes.length)}</td>
      <td>${evidencia(c)}</td>
      <td>${tagSug[c.sug]}<div class="peq t2">${h(c.motivo)}</div></td>
      <td><select class="campo" data-decision="${h(c.bname)}"><option value="" ${!c.manual ? 'selected' : ''}>Según sugerencia</option><option value="incluir" ${c.manual && c.final === 'incluir' ? 'selected' : ''}>Incluir</option><option value="excluir" ${c.manual && c.final === 'excluir' ? 'selected' : ''}>Excluir</option><option value="revisar" ${c.manual && c.final === 'revisar' ? 'selected' : ''}>Dejar en revisión</option></select></td>
      <td>${c.final === 'incluir' ? `<select class="campo" data-pais-cuenta="${h(c.bname)}"><option value="">${c.pais.length && !(S.conf.decisiones[c.bname] || {}).pais ? 'Auto: ' + c.pais.join('+') : 'Auto'}</option>${['UY', 'CL', 'UY+CL'].map((p) => `<option ${(S.conf.decisiones[c.bname] || {}).pais === p ? 'selected' : ''}>${p}</option>`).join('')}</select>` : '<span class="muted">—</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="10" class="muted" style="text-align:center;padding:24px">Nada para mostrar con este filtro.</td></tr>'}
    </tbody></table></div>
    ${pie(lista, pgU, 'u')}
  </div>
  ${cont.incluir ? '<div class="fila"><button class="btn prim" data-tab-ir="analisis">Siguiente: análisis del universo →</button></div>' : ''}`;
}

// -------------------------------------------------------- vista: análisis
const SENALES = [
  ['perfilCritico', 'alta', 'SAP_ALL o SAP_NEW asignado directamente', 'Perfil con acceso total o casi total, fuera de los roles. Revisar con prioridad.', (c) => c.critico],
  ['perfilDirecto', 'media', 'Otros perfiles asignados directamente', 'Perfiles que no provienen de un rol (UST04). Sus autorizaciones no se ven en los roles.', (c) => c.perfilesDirectos.some((p) => !PERFILES_CRITICOS.has(p))],
  ['bloqueada', 'media', 'Cuentas bloqueadas', 'UFLAG distinto de 0.', (c) => c.bloqueada],
  ['sinAcceso', 'media', 'Utilizables sin acceso reciente', (P) => `Último acceso hace más de ${P.diasSinAcceso} días respecto de la extracción. No prueba que el acceso sobre.`, (c, P) => c.utilizable && c.diasSinAcceso !== null && c.diasSinAcceso > P.diasSinAcceso],
  ['nuncaAccedio', 'media', 'Utilizables sin registro de acceso', 'TRDAT vacío.', (c) => c.utilizable && !c.trdat],
  ['muchosRoles', 'info', 'Cantidad alta de roles vigentes', (P) => `${P.umbralRoles} o más. Señal para revisar, no riesgo comprobado.`, (c, P) => c.vigentes.length >= P.umbralRoles],
  ['sinRoles', 'info', 'Utilizables sin roles vigentes', 'Podría tener perfiles asignados directamente (no extraídos).', (c) => c.utilizable && !c.vigentes.length],
  ['porVencer', 'info', 'Con roles que vencen en 30 días', '', (c) => c.roles.some((r) => r.porVencer)],
  ['rolesMixtos', 'media', 'Con roles de otros países', 'Cuenta del universo con roles que tienen pistas de Argentina u otro país.', (c) => c.ev.AR + c.ev.OTRO > 0],
  ['vencidaSinBloqueo', 'info', 'Validez vencida sin bloqueo', 'No puede iniciar sesión, pero no está bloqueada.', (c) => c.vigCuenta === 'vencida' && !c.bloqueada],
];
const txtSenal = (s, P) => typeof s[3] === 'function' ? s[3](P) : s[3];

function vistaAnalisis() {
  const C = S.calc, U = S.ui, P = S.conf;
  if (!C || !C.universo.length) return '<h1>Análisis</h1><div class="aviso warn"><b>El universo está vacío</b>Definí en el paso 2 qué cuentas incluir.</div>';
  const u = C.universo;
  const uy = u.filter((c) => c.pais.includes('UY') && !c.pais.includes('CL')).length;
  const cl = u.filter((c) => c.pais.includes('CL') && !c.pais.includes('UY')).length;
  const ambos = u.filter((c) => c.pais.length > 1).length;
  const asigVig = u.reduce((a, c) => a + c.vigentes.length, 0);
  const conteo = Object.fromEntries(SENALES.map((s) => [s[0], u.filter((c) => s[4](c, P)).length]));

  let lista = u;
  if (U.aFiltro && U.aFiltro.startsWith('s:')) { const s = SENALES.find((x) => x[0] === U.aFiltro.slice(2)); lista = lista.filter((c) => s[4](c, P)); }
  else if (U.aFiltro === 'UY') lista = lista.filter((c) => c.pais.includes('UY'));
  else if (U.aFiltro === 'CL') lista = lista.filter((c) => c.pais.includes('CL'));
  else if (U.aFiltro === 'utilizables') lista = lista.filter((c) => c.utilizable);
  if (U.aTexto) { const t = U.aTexto.toUpperCase(); lista = lista.filter((c) => c.bname.includes(t) || c.clase.includes(t) || c.vigentes.some((r) => r.includes(t)) || c.nombre.toUpperCase().includes(t)); }
  const [oc, od] = U.aOrden;
  const clave = { bname: (c) => c.bname, pais: (c) => c.pais.join('+'), estado: (c) => (c.bloqueada ? 2 : c.utilizable ? 0 : 1), acceso: (c) => c.trdat || '', roles: (c) => c.vigentes.length, senales: (c) => SENALES.filter((s) => s[4](c, P)).length }[oc];
  lista = [...lista].sort((a, b) => { const x = clave(a), y = clave(b); return (x > y ? 1 : x < y ? -1 : 0) * od; });
  const pg = paginar(lista, U.aPag, 100);

  // roles
  let roles = C.roles;
  if (U.rTexto) roles = roles.filter((r) => r.agr.includes(U.rTexto.toUpperCase()));
  const [rc, rd] = U.rOrden;
  roles = [...roles].sort((a, b) => ((a[rc] > b[rc] ? 1 : a[rc] < b[rc] ? -1 : 0) * rd) || a.agr.localeCompare(b.agr));
  const pgR = paginar(roles, U.rPag, 50);
  const th = (id, t, num, grupo) => { const o = grupo === 'r' ? U.rOrden : U.aOrden; return `<th class="ord ${num ? 'num' : ''}" data-orden="${grupo}:${id}">${t}${o[0] === id ? (o[1] > 0 ? ' ↑' : ' ↓') : ''}</th>`; };

  return `
  ${S.demo ? '<div class="banda-demo"><b>Datos de ejemplo ficticios.</b> <span class="t2">No provienen de SAP.</span></div>' : ''}
  <h1>Análisis del universo</h1>
  <p class="sub">Solo cuentas con decisión "incluir". Fecha de referencia ${fmtFecha(S.fechaRef)}. Nivel 1 — asignación: muestra roles registrados, no capacidad efectiva ni uso real.</p>
  <div class="grid g6">
    ${stat('Cuentas en el universo', u.length, '', 'a-todas')}
    ${stat('Uruguay', uy + ambos, ambos ? `${n(ambos)} también Chile` : '', 'a-UY')}
    ${stat('Chile', cl + ambos, ambos ? `${n(ambos)} también Uruguay` : '', 'a-CL')}
    ${stat('Utilizables', u.filter((c) => c.utilizable).length, 'sin bloqueo y vigentes', 'a-utilizables')}
    ${S.datos.UST04 ? stat('Con SAP_ALL / SAP_NEW', u.filter((c) => c.critico).length, 'asignado directamente', 'a-s:perfilCritico') : ''}
    ${stat('Roles distintos', C.roles.length, 'con asignación vigente')}
    ${stat('Asignaciones vigentes', asigVig)}
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card">${'<h2>Países</h2>' + barra([['Solo Uruguay', uy, 'var(--uy)'], ['Solo Chile', cl, 'var(--cl)'], ['Ambos', ambos, 'var(--s3)'], ['Sin país', u.length - uy - cl - ambos, 'var(--base)']])}</div>
    <div class="card"><h2>Parámetros</h2><div class="fila">
      <label>Días sin acceso <input type="number" min="1" class="campo" style="width:80px" id="pDias" value="${P.diasSinAcceso}"></label>
      <label>Roles "altos" desde <input type="number" min="1" class="campo" style="width:80px" id="pRoles" value="${P.umbralRoles}"></label>
    </div></div>
  </div>
  <div class="card">
    <h2>Señales para revisar</h2>
    <p class="t2 peq" style="margin-top:0">Indicios sobre asignaciones registradas, no hallazgos confirmados. Hacé clic en el número para filtrar la lista.</p>
    <table class="t"><tbody>${SENALES.map((s) => `<tr><td style="width:120px"><span class="sev ${s[1]}"><b>${s[1] === 'alta' ? '▲' : s[1] === 'media' ? '●' : 'i'}</b>${s[1] === 'info' ? 'Informativa' : s[1] === 'alta' ? 'Prioridad alta' : 'Revisar'}</span></td><td><b>${h(s[2])}</b><div class="peq t2">${h(txtSenal(s, P))}</div></td><td class="num"><button class="link" style="font-size:18px;font-weight:600" data-accion="a-s:${s[0]}">${n(conteo[s[0]])}</button></td></tr>`).join('')}</tbody></table>
  </div>
  <div class="card">
    <div class="card-h"><h2>Cuentas del universo</h2><button class="btn" data-accion="exportar-cuentas">Exportar CSV</button></div>
    <div class="fila" style="margin-bottom:8px">
      <select class="campo" id="aFiltro"><option value="">Todas</option><option value="UY" ${U.aFiltro === 'UY' ? 'selected' : ''}>Uruguay</option><option value="CL" ${U.aFiltro === 'CL' ? 'selected' : ''}>Chile</option><option value="utilizables" ${U.aFiltro === 'utilizables' ? 'selected' : ''}>Utilizables</option>${SENALES.map((s) => `<option value="s:${s[0]}" ${U.aFiltro === 's:' + s[0] ? 'selected' : ''}>${h(s[2])}</option>`).join('')}</select>
      <input class="campo" id="aTexto" placeholder="Buscar usuario, nombre, rol, grupo…" value="${h(U.aTexto)}">
    </div>
    <div class="tabla-wrap"><table class="t"><thead><tr>${th('bname', 'Usuario', 0, 'a')}${th('pais', 'País', 0, 'a')}<th>Tipo</th>${th('estado', 'Estado', 0, 'a')}${th('acceso', 'Último acceso', 0, 'a')}${th('roles', 'Roles vigentes', 1, 'a')}${th('senales', 'Señales', 0, 'a')}</tr></thead><tbody>
    ${pg.items.map((c) => { const ss = SENALES.filter((s) => s[4](c, P)); return `<tr><td><button class="link mono" data-ficha="${h(c.bname)}">${h(c.bname)}</button>${c.nombre ? `<div class="peq t2">${h(c.nombre)}</div>` : ''}</td><td>${c.pais.map(tagPais).join(' ') || '<span class="muted">—</span>'}</td><td>${h(TIPOS[c.ustyp] || c.ustyp || '—')}</td><td>${tagEstado(c)}</td><td>${c.trdat ? `${fmtFecha(c.trdat)}<div class="peq muted">hace ${c.diasSinAcceso} d</div>` : '<span class="muted">Sin registro</span>'}</td><td class="num">${n(c.vigentes.length)}</td><td>${ss.map((s) => `<span class="sev ${s[1]}" title="${h(s[2])}"><b>${s[1] === 'info' ? 'i' : s[1] === 'alta' ? '▲' : '●'}</b></span>`).join(' ') || '<span class="muted">—</span>'}</td></tr>`; }).join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Sin resultados.</td></tr>'}
    </tbody></table></div>
    ${pie(lista, pg, 'a')}
  </div>
  <div class="card">
    <div class="card-h"><h2>Roles asignados al universo</h2><button class="btn" data-accion="exportar-roles">Exportar CSV</button></div>
    <p class="t2 peq" style="margin-top:0">Consulta inversa. "Fuera del universo" indica cuántas cuentas no incluidas (p. ej. de Argentina) comparten el mismo rol: dato útil para el rediseño.</p>
    <input class="campo" id="rTexto" placeholder="Buscar rol…" value="${h(U.rTexto)}" style="margin-bottom:8px">
    <div class="tabla-wrap"><table class="t"><thead><tr>${th('agr', 'Rol', 0, 'r')}${th('enUniverso', 'Cuentas del universo', 1, 'r')}${th('uy', 'UY', 1, 'r')}${th('cl', 'CL', 1, 'r')}${th('fuera', 'Fuera del universo', 1, 'r')}<th>País según pistas</th></tr></thead><tbody>
    ${pgR.items.map((r) => `<tr><td><button class="link mono" data-rol="${h(r.agr)}">${h(r.agr)}</button></td><td class="num">${n(r.enUniverso)}</td><td class="num">${n(r.uy)}</td><td class="num">${n(r.cl)}</td><td class="num">${n(r.fuera)}</td><td>${C.tagsRol(r.agr)}</td></tr>`).join('')}
    </tbody></table></div>
    ${pie(roles, pgR, 'r')}
  </div>`;
}

// -------------------------------------------------------- vista: registro
function vistaRegistro() {
  const filas = Object.entries(S.datos).filter(([, d]) => d).map(([f, d]) => `<tr><td>${h(FUENTES[f].titulo)}</td><td>${h(d.meta.archivo)}</td><td class="mono peq">${h(d.meta.sha)}</td><td class="num">${n(d.meta.leidas)}</td><td class="num">${n(d.regs.length)}</td><td class="num">${n(d.meta.rechazadas)}</td><td class="num">${n(d.meta.duplicadas)}</td><td>${h(d.meta.cargado)}</td></tr>
    ${d.meta.adv.length ? `<tr><td></td><td colspan="7" class="peq t2">${d.meta.adv.map(h).join('<br>')}</td></tr>` : ''}`).join('');
  const C = S.calc;
  return `<h1>Registro y ayuda</h1>
  <div class="card"><h2>Archivos cargados en esta sesión</h2>
    ${filas ? `<div class="tabla-wrap"><table class="t"><thead><tr><th>Fuente</th><th>Archivo</th><th>SHA-256</th><th class="num">Leídas</th><th class="num">Aceptadas</th><th class="num">Rechazadas</th><th class="num">Duplicadas</th><th>Cargado</th></tr></thead><tbody>${filas}</tbody></table></div>` : '<p class="t2">Nada cargado todavía.</p>'}
    ${C && C.huerfanas.length ? `<div class="aviso warn" style="margin-top:12px"><b>${n(C.huerfanas.length)} usuario(s) de AGR_USERS no están en USR02</b>Puede indicar extracciones de momentos distintos o un filtro en USR02: ${h(C.huerfanas.slice(0, 30).join(', '))}${C.huerfanas.length > 30 ? '…' : ''}</div>` : ''}
  </div>
  <div class="card"><h2>Cómo se interpreta</h2>
    <ul class="t2" style="margin:0;padding-left:18px">

      <li><b>USTYP</b>: A diálogo, B sistema, C comunicación, L referencia, S servicio.</li>
      <li><b>Asignación vigente</b>: la fecha de extracción entre FROM_DAT y TO_DAT.</li>
      <li><b>COL_FLAG / ORG_FLAG</b> se muestran tal cual; su interpretación queda pendiente de validar.</li>
      <li><b>Universo</b>: sugerencia por pistas (roles, grupo, niveles organizativos, lista de referencia); la decisión manual siempre manda.</li>

    <button class="btn peligro" data-accion="borrar-conf">Borrar reglas y decisiones guardadas</button>
  </div>`;

// ---------------------------------------------------------------- eventos
async function elegirArchivo(fuente, file) {
  if (!file) return;
  try {
    const a = await leerArchivo(file);
    const punt = a.hojas.map((x) => puntaje(fuente, x.filas[filaEncabezado(fuente, x.filas)] || []));
    const hoja = punt.indexOf(Math.max(...punt));
    const fe = filaEncabezado(fuente, a.hojas[hoja].filas);
    S.pendiente = { fuente, archivo: a, hoja, fe, mapeo: mapeoSugerido(fuente, armarTabla(a.hojas[hoja], fe).enc) };
    validarPendiente();
  } catch (e) {
    S.pendiente = { fuente, archivo: { nombre: file.name, hojas: [{ filas: [] }], sha: '' }, hoja: 0, fe: 0, mapeo: {}, error: e.message || String(e) };
  }
  render();
  document.getElementById('mapeo').scrollIntoView({ behavior: 'smooth' });
}
const ORDEN_NOMBRES = ['AGR_USERS', 'AGR_1252', 'USR02', 'USR05', 'USR21', 'UST04', 'ADRP'];
function detectarFuente(nombre, archivo) {
  const up = nombre.toUpperCase();
  const porNombre = ORDEN_NOMBRES.find((f) => up.includes(f) || up.includes(f.replace('_', '')));
  if (porNombre) return porNombre;
  let mejor = null, p = 1; // al menos 2 encabezados reconocidos
  for (const f of Object.keys(FUENTES)) {
    for (const hj of archivo.hojas) { const q = puntaje(f, hj.filas[filaEncabezado(f, hj.filas)] || []); if (q > p) { p = q; mejor = f; } }
  }
  return mejor;
}
async function cargarVarios(files) {
  S.lote = [];
  S.pendiente = null;
  for (const file of files) {
    const item = { nombre: file.name, fuente: null, ok: false, msg: '' };
    S.lote.push(item);
    try {
      const a = await leerArchivo(file);
      item.archivo = a;
      const f = detectarFuente(file.name, a);
      if (!f) { item.msg = /ADRC/i.test(file.name) ? 'ADRC no se usa: la dirección de empresa es la misma para todos los usuarios, no indica país' : 'No se reconoció la tabla'; continue; }
      item.fuente = f;
      const punt = a.hojas.map((x) => puntaje(f, x.filas[filaEncabezado(f, x.filas)] || []));
      const hoja = punt.indexOf(Math.max(...punt));
      const fe = filaEncabezado(f, a.hojas[hoja].filas);
      const mapeo = mapeoSugerido(f, armarTabla(a.hojas[hoja], fe).enc);
      Object.assign(item, { hoja, fe, mapeo });
      const r = procesar(f, armarTabla(a.hojas[hoja], fe), mapeo);
      S.pendiente = { fuente: f, archivo: a, hoja, fe, mapeo, resultado: r };
      confirmarPendiente(false);
      Object.assign(item, { ok: true, filas: r.regs.length });
    } catch (e) {
      item.msg = e.message || String(e);
    }
  }
  S.pendiente = null;
  recalcular();
}
function validarPendiente() {
  const P = S.pendiente;
  P.error = null; P.resultado = null;
  try { P.resultado = procesar(P.fuente, armarTabla(P.archivo.hojas[P.hoja], P.fe), P.mapeo); }
  catch (e) { P.error = e.message || String(e); }
}
function confirmarPendiente(redibujar = true) {
  const P = S.pendiente, r = P.resultado;
  S.datos[P.fuente] = { regs: r.regs, meta: { archivo: P.archivo.nombre, sha: P.archivo.sha, leidas: r.leidas, rechazadas: r.rechazadas, duplicadas: r.duplicadas, adv: [...P.archivo.adv, ...r.adv], cargado: new Date().toLocaleString('es-UY') } };
  S.pendiente = null;
  if (P.fuente === 'AGR_USERS') aplicarSugeridas();
  if (P.fuente === 'AGR_1252' || P.fuente === 'USR05') aplicarSugeridasOrg();
  if (redibujar) recalcular();
}
function decidir(bnames, d, pais) {
  const ahora = new Date().toISOString();
  for (const b of bnames) {
    if (d === '' && !pais) delete S.conf.decisiones[b];
    else S.conf.decisiones[b] = Object.assign({}, S.conf.decisiones[b], { d, pais: pais !== undefined ? pais : (S.conf.decisiones[b] || {}).pais, fecha: ahora });
  }
  guardarConf();
  recalcular();
}

      const b = usuario(f[iu]), d = norm(f[id]);
      if (!b || !['incluir', 'excluir', 'revisar'].includes(d)) continue;
      if (io >= 0 && norm(f[io]) === 'sugerencia') continue; // solo se importan decisiones manuales
      S.conf.decisiones[b] = { d, pais: ip >= 0 ? txt(f[ip]).toUpperCase() : '', fecha: new Date().toISOString() };
      k++;
    }
    guardarConf(); t.value = ''; recalcular();
    alert(`Se importaron ${k} decisiones manuales. Las cuentas que no estaban en el archivo quedan según sugerencia.`);
  }
  if (t.id === 'importarConf' && t.files[0]) {
    try { S.conf = Object.assign({ reglas: [], decisiones: {} }, JSON.parse(await t.files[0].text())); guardarConf(); t.value = ''; recalcular(); }
    catch (err) { alert('No se pudo leer la configuración: ' + err.message); }
  }
});

// ------------------------------------------------------------ datos demo
// 100 % ficticios: usuarios de Uruguay, Chile y Argentina con convenciones de
// nombres de roles mixtas, para practicar la definición del universo.
function generarDemo() {
  let s = 20261020;
  const r = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const el = (l) => l[Math.floor(r() * l.length)];
  const NOM = ['ANA', 'BRUNO', 'CARLA', 'DIEGO', 'ELENA', 'FACUNDO', 'GABRIELA', 'HERNAN', 'INES', 'JAVIER', 'KARINA', 'LUCAS', 'MARTINA', 'NICOLAS', 'OLIVIA', 'PABLO', 'ROMINA', 'SANTIAGO', 'TAMARA', 'VALENTIN'];
  const APE = ['ACOSTA', 'BENITEZ', 'CABRERA', 'DIAZ', 'ESPINOZA', 'FERNANDEZ', 'GARCIA', 'HERRERA', 'IBARRA', 'JUAREZ', 'LOPEZ', 'MENDEZ', 'NUNEZ', 'OLIVERA', 'PEREZ', 'QUIROGA', 'RODRIGUEZ', 'SILVA', 'TORRES', 'VARGAS'];
  const MOD = { FI: ['CONSULTA', 'ASIENTOS', 'PROVEEDORES', 'TESORERIA'], MM: ['CONSULTA', 'PEDIDOS', 'LIBERACION'], SD: ['CONSULTA', 'PEDIDOS', 'FACTURACION', 'PRECIOS'], WM: ['STOCK', 'MOVIMIENTOS'] };
  const SOC = { UY: 'UY01', CL: 'CL01', AR: 'AR01' };
  const ref = '2026-10-20';
  const f8 = (d) => d.toISOString().slice(0, 10).replace(/-/g, '');
  const off = (k) => { const d = new Date(ref + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return d; };
  const usr = [['BNAME', 'USTYP', 'UFLAG', 'GLTGV', 'GLTGB', 'TRDAT', 'LTIME', 'CLASS']];
  const agr = [['UNAME', 'AGR_NAME', 'FROM_DAT', 'TO_DAT', 'COL_FLAG', 'ORG_FLAG']];
  const u21 = [['BNAME', 'PERSNUMBER']], adrp = [['PERSNUMBER', 'NAME_TEXT']], u05 = [['BNAME', 'PARID', 'PARVA']], u04 = [['BNAME', 'PROFILE']];
  let pers = 1000;
  const roles = new Set();
  const usados = new Set();
  const total = { UY: 70, CL: 45, AR: 260 };
  for (const [pais, cant] of Object.entries(total)) {
    for (let i = 0; i < cant; i++) {
      const nom = el(NOM), ape = el(APE);
      let b = nom[0] + ape;
      while (usados.has(b)) b = b.slice(0, 9) + String(Math.floor(r() * 99)).padStart(2, '0');
      usados.add(b);
      pers++;
      u21.push([b, String(pers)]);
      adrp.push([String(pers), `${nom[0]}${nom.slice(1).toLowerCase()} ${ape[0]}${ape.slice(1).toLowerCase()}`]);
      if (r() < 0.1) u05.push([b, 'BUK', SOC[pais]]);
      u05.push([b, 'SD_VARIANT_MAINTAIN', 'X']);
      u04.push([b, `T-SE${String(Math.floor(r() * 99999999)).padStart(8, '0')}`]);
      if (r() < 0.04) u04.push([b, 'SAP_ALL']);
      const clase = r() < 0.6 ? `SCIENZA_${pais}` : 'SCIENZA';
      usr.push([b, 'A', r() < 0.05 ? '64' : '0', f8(off(-Math.floor(200 + r() * 2000))), r() < 0.05 ? f8(off(-30)) : '99991231', r() < 0.05 ? '00000000' : f8(off(-Math.floor(r() < 0.15 ? 100 + r() * 300 : r() * 30))), '093000', clase]);
      const mods = Object.keys(MOD);
      const n1 = 2 + Math.floor(r() * 5);
      const asign = new Set(['Z_COMUN_LAUNCHPAD']);
      for (let k = 0; k < n1; k++) { const m = el(mods); const rol = pais === 'CL' ? `ZCL_${m}_${el(MOD[m])}` : `Z${pais}_${m}_${el(MOD[m])}`; asign.add(rol); }
      if (pais === 'UY' && r() < 0.12) asign.add(`ZCL_SD_${el(MOD.SD)}`); // opera también en Chile
      if (pais !== 'AR' && r() < 0.05) asign.add(`ZAR_FI_${el(MOD.FI)}`); // pista mixta
      if (r() < 0.2) asign.add(`Z_${el(mods)}_REPORTES_GLOBAL`); // rol sin país
      for (const rol of asign) { roles.add(rol); agr.push([b, rol, f8(off(-400)), r() < 0.05 ? f8(off(-20)) : '99991231', '', '']); }
    }
  }
  for (const [b, t] of [['RFC_INTEGRA', 'C'], ['BATCH_JOBS', 'B'], ['WF-BATCH', 'B'], ['SOPORTE_EXT', 'A'], ['CONSULTOR01', 'A']]) {
    usr.push([b, t, '0', '20200101', '99991231', t === 'A' ? f8(off(-3)) : '00000000', '', 'TECNICOS']);
    agr.push([b, 'Z_BC_SOPORTE', '20200101', '99991231', '', '']); roles.add('Z_BC_SOPORTE');
  }
  const org = [['AGR_NAME', 'VARBL', 'LOW', 'HIGH']];
  for (const rol of roles) {
    const m = /^Z(UY|CL|AR)_/.exec(rol);
    if (m) org.push([rol, '$BUKRS', SOC[m[1]], '']);
    else if (rol.includes('GLOBAL')) Object.values(SOC).forEach((v) => org.push([rol, '$BUKRS', v, '']));
  }
  const csv = (x) => x.map((f) => f.join(';')).join('\n');
  return { USR02: csv(usr), AGR_USERS: csv(agr), AGR_1252: csv(org), USR21: csv(u21), ADRP: csv(adrp), USR05: csv(u05), UST04: csv(u04), ref };
}
async function cargarDemo() {
  const d = generarDemo();
  for (const f of ['USR02', 'AGR_USERS', 'AGR_1252', 'USR21', 'ADRP', 'USR05', 'UST04']) {
    const filas = leerTexto(d[f]);
    const fe = filaEncabezado(f, filas);
    const tabla = armarTabla({ filas }, fe);
    const r = procesar(f, tabla, mapeoSugerido(f, tabla.enc));
    S.datos[f] = { regs: r.regs, meta: { archivo: `demo_${f}.csv`, sha: await sha256(new TextEncoder().encode(d[f])), leidas: r.leidas, rechazadas: r.rechazadas, duplicadas: r.duplicadas, adv: r.adv, cargado: new Date().toLocaleString('es-UY') } };
  }
  S.fechaRef = d.ref;
  S.demo = true;
  aplicarSugeridas();
  aplicarSugeridasOrg();
  recalcular();
}
