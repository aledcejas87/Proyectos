<script>
'use strict';
// =============================================================================
// SAP Access Control | Scienza — versión HTML única.
// Funciona abriendo este archivo en el navegador o publicado con Apps Script
// (HtmlService). Los archivos se procesan en memoria en el navegador; solo
// la configuración del universo (reglas y decisiones) se recuerda en este
// navegador, y se puede exportar/importar como archivo.
// =============================================================================

// ---------------------------------------------------------------- utilidades
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (x) => Number(x).toLocaleString('es-UY');
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const hoyISO = () => new Date().toISOString().slice(0, 10);
const fmtFecha = (iso) => { if (!iso) return '—'; if (iso === '9999-12-31') return 'Sin límite'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const PAISES = { UY: 'Uruguay', CL: 'Chile', AR: 'Argentina', OTRO: 'Otro país', NEUTRO: 'Sin país (ignorar)' };

// Persistencia. Publicada en Apps Script, la base es una hoja de cálculo privada
// (Codigo.gs): se lee al abrir y cada cambio se guarda solo, pocos segundos después.
// Abierta como archivo local, se guarda en este navegador.
const EN_GAS = !!(window.google && google.script && google.script.run);
const ALMACEN = {}; // clave → JSON en texto (modo Google Sheets)
const SYNC = { estado: EN_GAS ? 'cargando' : 'local', pendientes: new Set(), enVuelo: new Set(), ultimo: '', error: '', url: '', nombre: '' };
const temporizadores = {};
function guardarLocal(clave, valor) {
  const txt = JSON.stringify(valor);
  try { localStorage.setItem(clave, txt); } catch (e) { /* almacenamiento no disponible */ }
  if (EN_GAS) { ALMACEN[clave] = txt; programarGuardado(clave); }
}
function leerLocal(clave, defecto) {
  try { const v = EN_GAS ? ALMACEN[clave] : localStorage.getItem(clave); return v ? JSON.parse(v) : defecto; } catch (e) { return defecto; }
}
function programarGuardado(clave, demora = 1200) {
  SYNC.pendientes.add(clave); pintarSync();
  clearTimeout(temporizadores[clave]);
  temporizadores[clave] = setTimeout(() => enviarClave(clave), demora);
}
function enviarClave(clave) {
  if (SYNC.estado === 'error-carga') return; // sin leer la base no se escribe: se podría pisar información más nueva
  if (SYNC.enVuelo.has(clave)) return programarGuardado(clave, 800); // un envío por clave a la vez, en orden
  const txt = ALMACEN[clave];
  SYNC.enVuelo.add(clave); pintarSync();
  google.script.run
    .withSuccessHandler((r) => { SYNC.enVuelo.delete(clave); if (ALMACEN[clave] === txt) SYNC.pendientes.delete(clave); SYNC.ultimo = r.actualizado; SYNC.error = ''; pintarSync(); })
    .withFailureHandler((e) => { SYNC.enVuelo.delete(clave); SYNC.error = (e && e.message) || String(e); pintarSync(); programarGuardado(clave, 15000); })
    .guardarClave(clave, txt);
}
function guardarTodoAhora() { Object.keys(ALMACEN).forEach((k) => programarGuardado(k, 10)); }
function pintarSync() {
  const el = document.getElementById('sync');
  if (!el) return;
  const hora = (iso) => (iso ? new Date(iso).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }) : '');
  let txt, cls;
  if (SYNC.estado === 'local') { txt = 'Guardado en este navegador'; cls = ''; }
  else if (SYNC.estado === 'cargando') { txt = 'Leyendo la base de datos…'; cls = ''; }
  else if (SYNC.estado === 'error-carga') { txt = 'Sin conexión con la base: los cambios no se guardan en Sheets'; cls = 'mal'; }
  else if (SYNC.error) { txt = 'Error al guardar, reintentando…'; cls = 'mal'; }
  else if (SYNC.pendientes.size || SYNC.enVuelo.size) { txt = 'Guardando en Google Sheets…'; cls = 'pend'; }
  else { txt = `Guardado en Google Sheets${SYNC.ultimo ? ' · ' + hora(SYNC.ultimo) : ''}`; cls = 'ok'; }
  el.className = 'sync ' + cls;
  el.innerHTML = SYNC.url ? `<a href="${h(SYNC.url)}" target="_blank" rel="noopener" title="Abrir la hoja de cálculo">${h(txt)}</a>` : h(txt);
  el.title = SYNC.error || '';
}
window.addEventListener('beforeunload', (e) => { if (SYNC.pendientes.size || SYNC.enVuelo.size) { e.preventDefault(); e.returnValue = ''; } });

function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function descargarCsv(nombre, cab, filas) {
  const esc = (v) => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  descargar(nombre, '﻿' + [cab, ...filas].map((f) => f.map(esc).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

// ------------------------------------------------------- interpretación SAP
function iso(y, m, d) {
  if (y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const f = new Date(Date.UTC(y, m - 1, d));
  if (f.getUTCMonth() !== m - 1) return null;
  return `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
/** Devuelve {v: 'AAAA-MM-DD'|null, mal: bool}. Vacío y 00000000 = sin dato. */
function leerFecha(c, orden) {
  if (c == null) return { v: null, mal: false };
  if (c instanceof Date) return isNaN(c) ? { v: null, mal: true } : { v: iso(c.getFullYear(), c.getMonth() + 1, c.getDate()), mal: false };
  if (typeof c === 'number') {
    if (c === 0) return { v: null, mal: false };
    if (c >= 19000101 && c <= 99991231) { const s = String(Math.trunc(c)); const v = iso(+s.slice(0, 4), +s.slice(4, 6), +s.slice(6, 8)); return { v, mal: !v }; }
    if (c >= 1 && c <= 2958465) { const f = new Date(Math.round((c - 25569) * 86400000)); const v = iso(f.getUTCFullYear(), f.getUTCMonth() + 1, f.getUTCDate()); return { v, mal: !v }; }
    return { v: null, mal: true };
  }
  const s = String(c).trim();
  if (['', '0', '00000000', '00.00.0000', '00/00/0000', '0000-00-00'].includes(s)) return { v: null, mal: false };
  let m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if (m) { const v = iso(+m[1], +m[2], +m[3]); return { v, mal: !v }; }
  m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s);
  if (m) { const v = iso(+m[1], +m[2], +m[3]); return { v, mal: !v }; }
  m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/.exec(s);
  if (m) { const diaPrimero = s.includes('.') || orden !== 'MDY'; const v = diaPrimero ? iso(+m[3], +m[2], +m[1]) : iso(+m[3], +m[1], +m[2]); return { v, mal: !v }; }
  if (/^\d+(\.\d+)?$/.test(s)) return leerFecha(Number(s), orden);
  return { v: null, mal: true };
}
function ordenFechas(celdas) {
  let dmy = false, mdy = false;
  for (const c of celdas) {
    if (typeof c !== 'string') continue;
    const m = /^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/.exec(c.trim());
    if (!m) continue;
    if (+m[1] > 12) dmy = true;
    if (+m[2] > 12) mdy = true;
  }
  return { orden: mdy && !dmy ? 'MDY' : 'DMY', conflicto: dmy && mdy };
}
function leerHora(c) {
  if (c == null || c === '') return null;
  const f = (hh, mi, se) => (hh > 23 || mi > 59 || se > 59) ? null : [hh, mi, se].map((x) => String(x).padStart(2, '0')).join(':');
  if (typeof c === 'number') {
    if (c > 0 && c < 1) { const t = Math.round(c * 86400); return f(Math.floor(t / 3600), Math.floor(t % 3600 / 60), t % 60); }
    return leerHora(String(Math.trunc(c)).padStart(6, '0'));
  }
  const s = String(c).trim();
  let m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s);
  if (m) return f(+m[1], +m[2], +(m[3] || 0));
  m = /^(\d{2})(\d{2})(\d{2})$/.exec(s.padStart(6, '0'));
  return m ? f(+m[1], +m[2], +m[3]) : null;
}
const txt = (c) => c == null ? '' : String(c).trim();
const usuario = (c) => txt(c).toUpperCase();

const TIPOS = { A: 'Diálogo', B: 'Sistema', C: 'Comunicación', L: 'Referencia', S: 'Servicio' };
const BITS_UFLAG = [[32, 'Bloqueo global por administrador (CUA)'], [64, 'Bloqueo local por administrador'], [128, 'Bloqueo por intentos fallidos de contraseña']];
function motivosBloqueo(u) {
  if (!u) return [];
  const r = []; let resto = u;
  for (const [b, e] of BITS_UFLAG) if (u & b) { r.push(e); resto &= ~b; }

  if (/AMBOS|UY CL|CL UY|UY Y CL/.test(s)) return ['UY', 'CL'];

  if (/\bAR\b|ARGENTINA|\bARG\b/.test(s)) r.push('AR');

    return (riesgoRol[agr] = { todas, criticas });
  };
  const params = {};
  regs('USR05').forEach((x) => { if (camposParam.has(x.parid)) (params[x.bname] = params[x.bname] || []).push(x); });

  const usuariosPorRol = {};
  for (const a of asig) if (vigencia(a.desde, a.hasta, ref) === 'vigente') (usuariosPorRol[a.agr] = usuariosPorRol[a.agr] || new Set()).add(a.uname);
  const orgPorRol = {};
  for (const o of org) (orgPorRol[o.agr] = orgPorRol[o.agr] || []).push(o);

  // Catálogo de datos que pueden indicar país, con su uso, propuesta y definición.
  const cat = {};
  const item = (tipo, campo, valor) => { const k = claveRegla(tipo, campo, valor); return cat[k] = cat[k] || { k, tipo, campo: campo || '', valor, roles: new Set(), usuarios: new Set() }; };
  const sumarRol = (x, agr) => { x.roles.add(agr); for (const u of usuariosPorRol[agr] || []) x.usuarios.add(u); };
  for (const o of org) if (camposOrg.has(o.varbl) && o.low && o.low !== '*') sumarRol(item('org', o.varbl, o.low), o.agr);
  for (const x of regs('USR05')) if (camposParam.has(x.parid)) item('param', x.parid, x.parva).usuarios.add(x.bname);
  for (const agr of Object.keys(usuariosPorRol)) {
    for (const t of new Set(tokensDe(agr))) if (propuesta('token', '', t) || P.definiciones[claveRegla('token', '', t)]) sumarRol(item('token', '', t), agr);
  }
  for (const u of usr) if (u.clase) item('clase', '', u.clase).usuarios.add(u.bname);
  for (const d of Object.values(P.definiciones)) {
    const x = item(d.tipo, d.campo, d.valor);
    if (d.tipo === 'contiene') for (const agr of Object.keys(usuariosPorRol)) if (agr.includes(d.valor)) sumarRol(x, agr);
    if (d.tipo === 'rol') sumarRol(x, d.valor);
  }
  const catalogo = Object.values(cat).map((x) => ({ ...x, roles: x.roles.size, usuarios: x.usuarios.size, ejemplos: [...x.roles].slice(0, 3), listaRoles: x.roles, prop: propuesta(x.tipo, x.campo, x.valor), def: P.definiciones[x.k] || null }))
    .sort((a, b) => b.usuarios - a.usuarios || b.roles - a.roles || a.k.localeCompare(b.k));
  const catPorK = {};
  catalogo.forEach((x) => (catPorK[x.k] = x));

  // Reglas efectivas: solo definiciones confirmadas (o propuestas, en modo provisorio/demo).
  const usarProp = P.usarPropuestas || S.demo;
  const rTok = {}, rCont = [], rClase = {}, rOrg = {}, rParam = {}, rRol = {};
  for (const x of catalogo) {
    const pais = x.def ? x.def.pais : (usarProp && x.prop ? x.prop.pais : '');
    if (x.tipo === 'rol' && pais) { rRol[x.valor] = pais; continue; } // la excepción por rol admite "sin país"
    if (!pais || pais === 'NEUTRO') continue;
    if (x.tipo === 'token') rTok[x.valor] = pais;
    else if (x.tipo === 'contiene') rCont.push({ valor: x.valor, pais });
    else if (x.tipo === 'clase') rClase[x.valor] = pais;
    else if (x.tipo === 'org') rOrg[`${x.campo}=${x.valor}`] = pais;
    else if (x.tipo === 'param') rParam[`${x.campo}=${x.valor}`] = pais;
  }

  // Contexto para decidir un nivel organizativo: país de sus roles según el nombre
  // (definiciones confirmadas o propuestas) y otros valores del mismo campo que lo acompañan.
  const paisDe = (y) => (y ? (y.def ? y.def.pais : y.prop ? y.prop.pais : '') : '');
  const contieneP = catalogo.filter((y) => y.tipo === 'contiene' && paisDe(y) && paisDe(y) !== 'NEUTRO');
  const cacheNombre = {};
  const paisNombreRol = (agr) => {
    if (agr in cacheNombre) return cacheNombre[agr];
    const ex = paisDe(catPorK[claveRegla('rol', '', agr)]);
    if (ex) return (cacheNombre[agr] = ex === 'NEUTRO' ? '' : ex);
    const ps = new Set();
    for (const t of tokensDe(agr)) { const p = paisDe(catPorK[claveRegla('token', '', t)]); if (p && p !== 'NEUTRO') ps.add(p); }
    for (const y of contieneP) if (agr.includes(y.valor)) ps.add(paisDe(y));
    return (cacheNombre[agr] = ps.size === 1 ? [...ps][0] : ps.size > 1 ? 'MULTI' : '');
  };
  const valoresPorRolCampo = {};
  for (const o of org) if (camposOrg.has(o.varbl) && o.low && o.low !== '*') (valoresPorRolCampo[`${o.agr}|${o.varbl}`] = valoresPorRolCampo[`${o.agr}|${o.varbl}`] || new Set()).add(o.low);
  for (const x of catalogo) {
    if (x.tipo !== 'org') continue;
    const dist = {}, otros = {};
    for (const agr of x.listaRoles) {
      const p = paisNombreRol(agr); dist[p] = (dist[p] || 0) + 1;
      for (const v of valoresPorRolCampo[`${agr}|${x.campo}`] || []) if (v !== x.valor) otros[v] = (otros[v] || 0) + 1;
    }
    x.porNombre = dist;
    x.acompanan = Object.entries(otros).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([v, k]) => { const y = catPorK[claveRegla('org', x.campo, v)]; return { v, k, pais: paisDe(y) }; });
  }
  for (const x of catalogo) delete x.listaRoles;
  // Países que indican los niveles organizativos de un rol (confirmados o propuestos), para revisar excepciones.
  const paisOrgRol = (agr) => [...new Set((orgPorRol[agr] || []).map((o) => paisDe(catPorK[claveRegla('org', o.varbl, o.low)])).filter((p) => p && p !== 'NEUTRO'))].sort();

  // País de un rol. El nombre del rol manda sobre los niveles organizativos.
  // Un rol solo es pista si apunta a UN país: los roles multipaís (p. ej. una
  // org. de compras de Argentina y otra de Uruguay) quedan neutros.
  const cachePais = {};
  const paisesDeRol = (agr) => {
    if (cachePais[agr]) return cachePais[agr];
    // Excepción definida para este rol: manda sobre el nombre y los niveles organizativos.
    if (rRol[agr]) return (cachePais[agr] = { paises: rRol[agr] === 'NEUTRO' ? [] : [rRol[agr]], multi: [], fuente: 'rol', motivos: [`excepción del rol: ${PAISES[rRol[agr]]}`] });
    const porNombre = new Set(), porOrg = new Set(), motivos = [];
    for (const t of tokensDe(agr)) if (rTok[t]) { porNombre.add(rTok[t]); motivos.push(`nombre: ${t}`); }
    for (const r of rCont) if (agr.includes(r.valor)) { porNombre.add(r.pais); motivos.push(`nombre contiene ${r.valor}`); }
    for (const o of orgPorRol[agr] || []) { const k = `${o.varbl}=${o.low}`; if (rOrg[k]) { porOrg.add(rOrg[k]); motivos.push(k); } }
    const base = porNombre.size ? porNombre : porOrg;
    const lista = [...base].sort();
    return (cachePais[agr] = { paises: lista.length === 1 ? lista : [], multi: lista.length > 1 ? lista : [], fuente: porNombre.size ? 'nombre' : porOrg.size ? 'org' : '', motivos });
  };
  const tagsRol = (agr) => { const x = paisesDeRol(agr); return x.paises.length ? x.paises.map(tagPais).join(' ') : x.multi.length ? `<span class="tag" title="${h(x.motivos.slice(0, 10).join(', '))}"><i></i>Multipaís ${x.multi.join('+')}</span>` : '<span class="muted">—</span>'; };

  const refPorUsuario = {};
  for (const r of refl) refPorUsuario[r.usuario] = r;

  const asigPorUsuario = {};
  for (const a of asig) {
    const e = vigencia(a.desde, a.hasta, ref);
    const x = Object.assign({}, a, { estado: e, porVencer: e === 'vigente' && a.hasta && a.hasta !== '9999-12-31' && dias(ref, a.hasta) <= 30 });
    (asigPorUsuario[a.uname] = asigPorUsuario[a.uname] || []).push(x);
  }

  const cuentas = usr.map((u) => {
    const roles = (asigPorUsuario[u.bname] || []).sort((a, b) => a.agr.localeCompare(b.agr));
    // Para cada rol, de qué compuesto(s) asignados al usuario proviene.
    const compuestosDelUsuario = roles.filter((r) => infoRol[r.agr] && infoRol[r.agr].compuesto);
    for (const r of roles) r.via = compuestosDelUsuario.filter((c) => infoRol[c.agr].hijos.includes(r.agr)).map((c) => c.agr);
    const vig = roles.filter((r) => r.estado === 'vigente');
    const base = vig.length ? vig : roles;
    const ev = { UY: 0, CL: 0, AR: 0, OTRO: 0 }, motivosEv = {};
    let multipais = 0;
    for (const r of base) {
      const p = paisesDeRol(r.agr);
      if (p.multi.length) multipais++;
      for (const c of p.paises) { ev[c]++; (motivosEv[c] = motivosEv[c] || []).push(r.agr); }
    }
    if (rClase[u.clase]) { ev[rClase[u.clase]] += 1; (motivosEv[rClase[u.clase]] = motivosEv[rClase[u.clase]] || []).push(`grupo ${u.clase}`); }
    for (const x of params[u.bname] || []) { const c = rParam[`${x.parid}=${x.parva}`]; if (c) { ev[c] += 1; (motivosEv[c] = motivosEv[c] || []).push(`parámetro ${x.parid}=${x.parva}`); } }
    const susPerfiles = perfiles[u.bname] || [];
    const perfilesDirectos = susPerfiles.filter((p) => !esPerfilGenerado(p));
    const enRef = refPorUsuario[u.bname];
    const bloqueada = !!u.uflag;
    const vigCuenta = vigencia(u.gltgv, u.gltgb, ref);
    const tecnica = u.ustyp !== '' && u.ustyp !== 'A';

    // Sugerencia
    let sug, motivo;
    const local = ev.UY + ev.CL > 0, externa = ev.AR + ev.OTRO > 0;
    if (S.conf.excluirTecnicas && tecnica) { sug = 'excluir'; motivo = `Cuenta técnica (${TIPOS[u.ustyp] || u.ustyp})`; }
    else if (enRef) { sug = 'incluir'; motivo = 'Está en la lista de referencia'; }
    else if (local && !externa) { sug = 'incluir'; motivo = 'Solo pistas de UY/CL'; }
    else if (!local && externa) { sug = 'excluir'; motivo = 'Solo pistas de otros países'; }
    else if (local && externa) { sug = 'revisar'; motivo = 'Pistas mixtas'; }
    else { sug = 'revisar'; motivo = roles.length ? 'Sin pistas de país' : 'Sin roles asignados'; }

    const dec = S.conf.decisiones[u.bname];
    const final = dec && dec.d ? dec.d : sug;
    let paisSug = [];
    if (enRef && enRef.paises.length) paisSug = enRef.paises.filter((p) => p === 'UY' || p === 'CL');
    else paisSug = ['UY', 'CL'].filter((p) => ev[p] > 0);
    const pais = dec && dec.pais ? dec.pais.split('+') : paisSug;

    return {
      ...u, roles, vigentes: [...new Set(vig.map((r) => r.agr))], ev, motivosEv, enRef, tecnica,
      refuser: refUsers[u.bname] ? refUsers[u.bname].refuser : '', alias: refUsers[u.bname] ? refUsers[u.bname].alias : '',
      rolesObsoletos: [...new Set(vig.filter((r) => infoRol[r.agr] && infoRol[r.agr].obsoleto).map((r) => r.agr))],
      rolesTodasTx: hayTx ? [...new Set(vig.filter((r) => riesgoDe(r.agr).todas).map((r) => r.agr))] : [],
      txCriticas: hayTx ? [...new Set(vig.flatMap((r) => [...riesgoDe(r.agr).criticas]))].sort() : [],
      txMenu: hayTx ? new Set(vig.flatMap((r) => (txMenu[r.agr] || []).map((t) => t.tcode))).size : 0,
      catalogos: hayFiori ? [...new Set(vig.flatMap((r) => (fioriRol[r.agr] || { catalogos: [] }).catalogos))] : [],
      nombre: nombres[u.bname] || (enRef ? enRef.nombre : ''), perfilesDirectos, perfilesGenerados: susPerfiles.length - perfilesDirectos.length,
      critico: perfilesDirectos.some((p) => PERFILES_CRITICOS.has(p)), params: params[u.bname] || [],
      bloqueada, motivos: motivosBloqueo(u.uflag), vigCuenta, utilizable: !bloqueada && vigCuenta === 'vigente',
      diasSinAcceso: u.trdat ? dias(u.trdat, ref) : null,
      multipais, sug, motivo, manual: !!(dec && dec.d), final, pais, nota: dec ? dec.nota || '' : '',
    };
  });
  const porNombre = {};
  cuentas.forEach((c) => porNombre[c.bname] = c);
  const universo = cuentas.filter((c) => c.final === 'incluir');
  const enU = new Set(universo.map((c) => c.bname));

  // Alcance por país: de qué países son las sociedades, centros y organizaciones de los roles
  // vigentes (definición confirmada; si no hay, dato maestro de SAP; en modo provisorio, la propuesta).
  const paisValorOrg = (campo, valor) => {
    const y = catPorK[claveRegla('org', campo, valor)];
    if (y && y.def) return y.def.pais === 'NEUTRO' ? '' : y.def.pais;
    const mm = MAESTRO[`${campoBase(campo)}=${valor}`];
    if (mm) return mm.pais;
    return usarProp && y && y.prop && y.prop.pais !== 'NEUTRO' ? y.prop.pais : '';
  };
  const conocidos = {}; // campo → valores conocidos (para resolver rangos)
  for (const k of Object.keys(MAESTRO)) { const [c0, v] = k.split('='); (conocidos[c0] = conocidos[c0] || new Set()).add(v); }
  for (const x of catalogo) if (x.tipo === 'org') (conocidos[campoBase(x.campo)] = conocidos[campoBase(x.campo)] || new Set()).add(x.valor);
  const cacheAlcance = {};
  const alcanceRol = (agr) => {
    if (cacheAlcance[agr]) return cacheAlcance[agr];
    const items = [];
    for (const o of orgPorRol[agr] || []) {
      if (!camposOrg.has(o.varbl) || !campoBase(o.varbl)) continue;
      if (o.low === '*' || (o.low.endsWith('*') && !o.high)) { items.push({ campo: o.varbl, valor: o.low, pais: '*' }); continue; }
      const vals = o.high ? [...(conocidos[campoBase(o.varbl)] || [])].filter((v) => v >= o.low && v <= o.high) : [o.low];
      for (const v of vals) { const p = paisValorOrg(o.varbl, v); if (p) items.push({ campo: o.varbl, valor: o.high ? `${v} (rango ${o.low}–${o.high})` : v, pais: p }); }
    }
    return (cacheAlcance[agr] = items);
  };
  for (const c of cuentas) {
    const det = {};
    for (const agr of c.vigentes) for (const it of alcanceRol(agr)) { const k = `${it.pais}|${it.campo}|${it.valor}`; (det[k] = det[k] || Object.assign({ roles: [] }, it)).roles.push(agr); }
    const detalle = Object.values(det).sort((a, b) => a.pais.localeCompare(b.pais) || a.campo.localeCompare(b.campo) || a.valor.localeCompare(b.valor));
    const paises = [...new Set(detalle.map((d) => d.pais))].sort();
    const enUniv = enU.has(c.bname);
    const fuera = enUniv && c.pais.length ? paises.filter((p) => p === '*' || !c.pais.includes(p)) : [];
    c.alcance = { paises, fuera, detalle };
    // Fuera del universo: qué datos de Uruguay o Chile alcanzan (análisis aparte).
    if (!enUniv) c.alcanceUyCl = detalle.filter((d) => d.pais === 'UY' || d.pais === 'CL' || d.pais === '*');
  }

  // Roles: vista inversa
  const roles = {};
  for (const c of cuentas) for (const r of c.roles) {
    if (r.estado !== 'vigente') continue;
    const x = roles[r.agr] = roles[r.agr] || { agr: r.agr, enUniverso: 0, uy: 0, cl: 0, fuera: 0, usuarios: [] };
    if (enU.has(c.bname)) { x.enUniverso++; x.usuarios.push(c.bname); if (c.pais.includes('UY')) x.uy++; if (c.pais.includes('CL')) x.cl++; }
    else x.fuera++;
  }
  const huerfanas = [...new Set(asig.filter((a) => !porNombre[a.uname]).map((a) => a.uname))];
  S.calc = { paisOrgRol, paisNombreRol, usuariosPorRol, hayUso, usoUsr, periodoUso, hayFiori, fioriRol, tituloCatalogo, appsDeCatalogo, nombreServicio, serviciosRol, chipsCat, hayTx, txMenu, stcode, autRol, textoTx, infoRol, catalogo, catPorK, tagsRol, cuentas, porNombre, universo, roles: Object.values(roles).filter((r) => r.enUniverso > 0), rolesTodos: roles, huerfanas, paisesDeRol };
  S.calc.riesgos = evaluarRiesgos();
}


// ------------------------------------------------------------- componentes
// Descripción y tipo de un rol (con la estructura de la ronda 2 cargada).
function infoDeRol(agr) { return (S.calc && S.calc.infoRol[agr]) || null; }
function etiquetasRol(agr) {
  const x = infoDeRol(agr);
  if (!x) return '';
  const t = [];
  if (x.compuesto) t.push(`<span class="tag acc" title="${h(x.hijos.length + ' rol(es) simples')}"><i></i>Compuesto</span>`);
  if (x.padre) t.push(`<span class="tag" title="Derivado de ${h(x.padre)}"><i></i>Derivado</span>`);
  if (x.obsoleto) t.push('<span class="tag warn"><i></i>Obsoleto</span>');
  if (/^(SAP_|\/)/.test(agr)) t.push('<span class="tag"><i></i>Estándar SAP</span>');
  return t.join(' ');
}
const celdaRol = (agr, accion) => `${accion ? `<button class="link mono" data-rol="${h(agr)}">${h(agr)}</button>` : `<span class="mono">${h(agr)}</span>`} ${etiquetasRol(agr)}${infoDeRol(agr) && infoDeRol(agr).desc ? `<div class="peq t2">${h(infoDeRol(agr).desc)}</div>` : ''}`;
const tagPais = (p) => `<span class="tag ${p.toLowerCase()}"><i></i>${p}</span>`;
const tagSug = { incluir: '<span class="tag ok"><i></i>Incluir</span>', excluir: '<span class="tag"><i></i>Excluir</span>', revisar: '<span class="tag warn"><i></i>Revisar</span>' };
function tagEstado(c) {
  if (c.bloqueada) return `<span class="tag crit" title="${h(c.motivos.join(' · '))}"><i></i>Bloqueada</span>`;
  if (c.vigCuenta !== 'vigente') return `<span class="tag warn"><i></i>Validez ${c.vigCuenta}</span>`;
  return '<span class="tag ok"><i></i>Utilizable</span>';
}
function evidencia(c) {
  const p = Object.entries(c.ev).filter(([, v]) => v > 0);
  const t = p.map(([k, v]) => `<span class="tag ${k.toLowerCase()}" title="${h((c.motivosEv[k] || []).slice(0, 8).join(', '))}"><i></i>${k} ${v}</span>`).join(' ');
  const m = c.multipais ? ` <span class="tag" title="Roles que apuntan a más de un país: no cuentan como pista"><i></i>${c.multipais} multipaís</span>` : '';
  return (c.enRef ? '<span class="tag acc"><i></i>Lista ref.</span> ' : '') + (t || (m ? '' : '<span class="muted">—</span>')) + m;
}
function stat(e, v, d, accion) {
  const cont = `<div class="e">${h(e)}</div><div class="v">${typeof v === 'number' ? n(v) : h(v)}</div>${d ? `<div class="d">${h(d)}</div>` : ''}`;
  return accion ? `<button class="stat" data-accion="${accion}">${cont}</button>` : `<div class="stat">${cont}</div>`;
}
function barra(partes) {
  const tot = partes.reduce((a, p) => a + p[1], 0) || 1;
  return `<div class="barra" role="img" aria-label="${h(partes.map((p) => `${p[0]}: ${p[1]}`).join(', '))}">${partes.filter((p) => p[1] > 0).map((p) => `<div title="${h(p[0])}: ${n(p[1])}" style="width:${p[1] / tot * 100}%;background:${p[2]}"></div>`).join('')}</div>
  <div class="leyenda">${partes.map((p) => `<span style="--c:${p[2]}">${h(p[0])}: <b style="color:var(--text)">${n(p[1])}</b></span>`).join('')}</div>`;
}
function paginar(lista, pag, por) {
  const total = Math.max(1, Math.ceil(lista.length / por));
  const p = Math.min(pag, total - 1);
  return { items: lista.slice(p * por, (p + 1) * por), p, total };
}
function pie(lista, pg, clave) {
  return `<div class="pag"><span>${n(lista.length)} fila(s)</span>${pg.total > 1 ? `<span class="fila"><button class="btn mini" data-pag="${clave}" data-dir="-1" ${pg.p === 0 ? 'disabled' : ''}>Anterior</button> Página ${pg.p + 1} de ${pg.total} <button class="btn mini" data-pag="${clave}" data-dir="1" ${pg.p >= pg.total - 1 ? 'disabled' : ''}>Siguiente</button></span>` : ''}</div>`;
}

const ETIQUETAS_CAMPO = { BUKRS: 'la sociedad', VKORG: 'la organización de ventas', KOKRS: 'la sociedad CO', EKORG: 'la organización de compras', KKBER: 'el área de control de créditos', VKBUR: 'la oficina de ventas', VKGRP: 'el grupo de vendedores', WERKS: 'el centro', SWERK: 'el centro de mantenimiento', BWKEY: 'el ámbito de valoración', IWERK: 'el centro de planificación' };
const GRUPOS = [['base', 'Necesarios'], ['pistas', 'Pistas de país'], ['maestros', 'Datos maestros de organización (país desde SAP, recomendados)'], ['roles', 'Estructura de roles'], ['permisos', 'Transacciones y autorizaciones'], ['fiori', 'Fiori'], ['uso', 'Evidencia de uso (opcional)'], ['complementos', 'Complementos']];
// Qué se pierde si falta cada tabla (las de evidencia de uso y la lista de referencia son opcionales).
const IMPACTO_FALTANTE = {
  USR02: 'Sin cuentas no hay análisis: es obligatoria.', AGR_USERS: 'Sin asignaciones de roles no hay análisis: es obligatoria.',

function riesgosPropuestos() { return PROPUESTA_CONSULTORIA ? JSON.parse(JSON.stringify(PROPUESTA_CONSULTORIA)) : propuestaGenerica(); }

const guardarRiesgos = () => guardarLocal(CLAVE_RIESGOS, S.riesgos);

function parsearCondicion(linea) {
  return linea.split('||').map((alt) => {
    const partes = alt.trim().split(/\s+/).filter(Boolean);
    return {
      obj: (partes.shift() || '').toUpperCase(),
      conds: partes.map((p) => { const [c, v = ''] = p.split('='); return { campo: c.toUpperCase(), valores: v === '+' ? '+' : v.toUpperCase().split(',').filter(Boolean) }; }),
    };
  }).filter((a) => a.obj);
}
const esVacio = (v) => !v.low || v.low === "' '";

// Evalúa reglas sobre las cuentas del universo.
function evaluarRiesgos() {
  const C = S.calc, R = S.riesgos;
  if (!C.hayTx) return null;
  const hay1251 = !!S.datos.AGR_1251;
  // Instancias de autorización por rol: rol → objeto → [ {campo: [valores]} ]
  const inst = {};
  for (const [agr, filas] of Object.entries(C.autRol)) {
    const porAuth = {};
    for (const x of filas) {
      const k = `${x.obj}|${x.auth}`;
      const i = porAuth[k] = porAuth[k] || { obj: x.obj, campos: {} };
      (i.campos[x.campo] = i.campos[x.campo] || []).push(x);
    }
    inst[agr] = {};
    for (const i of Object.values(porAuth)) (inst[agr][i.obj] = inst[agr][i.obj] || []).push(i.campos);
  }
  const cubre = (vals, req) => (req === '+' ? vals.some((v) => !esVacio(v)) : req.some((r) => vals.some((v) => v.low === '*' || coincide(r, v))));
  // En S_SERVICE se puede escribir SRV_NAME=@NOMBRE (por ejemplo @API_SALES_ORDER_SRV): se traduce a los hash de USOBHASH.
  const hashesDe = (nombre) => Object.entries(C.nombreServicio || {}).filter(([, nom]) => nom.toUpperCase().startsWith(nombre)).map(([hsh]) => hsh);
  const capPorId = Object.fromEntries(R.capacidades.map((c) => [c.id, { ...c, lineas: c.obj.map((l) => parsearCondicion(l).map((alt) => ({ obj: alt.obj, conds: alt.conds.map((q) => (q.valores !== '+' && q.valores.some((v) => v.startsWith('@')) ? { campo: q.campo, valores: q.valores.flatMap((v) => (v.startsWith('@') ? hashesDe(v.slice(1)) : [v])) } : q)) }))) }]));
  const evaluar = (c, cap) => {
    if (c.perfilesDirectos.includes('SAP_ALL')) return { ok: true, via: ['SAP_ALL (perfil directo)'], roles: ['SAP_ALL'] };
    const via = [], todos = [];
    if (cap.tx.length) {
      const roles = c.vigentes.filter((agr) => hay1251 ? (C.stcode[agr] || []).some((v) => cap.tx.some((t) => coincide(t, v))) : (C.txMenu[agr] || []).some((t) => cap.tx.includes(t.tcode)));
      if (!roles.length) return { ok: false };
      via.push(`Transacción: ${roles.join(', ')}`);
      todos.push(...roles);
    }
    for (const alts of cap.lineas) {
      let roles = [];
      for (const alt of alts) roles = roles.concat(c.vigentes.filter((agr) => (inst[agr] && inst[agr][alt.obj] || []).some((campos) => alt.conds.every((q) => campos[q.campo] && cubre(campos[q.campo], q.valores)))));
      if (!roles.length) return { ok: false };
      via.push(`${alts.map((a) => a.obj).join(' o ')}: ${[...new Set(roles)].join(', ')}`);
      todos.push(...roles);
    }
    return { ok: true, via, roles: [...new Set(todos)] };
  };
  // Uso observado de una capacidad: documentos con una de sus transacciones, o de una tabla / clase asociada (USO_CAP).
  const usoDe = (c, id) => {
    const ev = C.usoUsr[c.bname], cap = capPorId[id];
    if (!ev || !cap) return null;
    let docs = 0, hasta = null; const tx = new Set();
    for (const x of ev) {
      const porTx = x.tcode && cap.tx.includes(x.tcode);
      const porTabla = (USO_CAP[x.clase ? `${x.tabla}|${x.clase}` : x.tabla] || []).includes(id);
      if (!porTx && !porTabla) continue;
      docs += x.n; tx.add(x.tcode || x.tabla);
      if (x.hasta && (!hasta || x.hasta > hasta)) hasta = x.hasta;
    }
    return docs ? { docs, hasta, tx: [...tx] } : null;
  };
  const hallazgos = [], cuentasPorCap = {}, rolesPorCap = {}, usoPorCap = {};
  for (const c of C.universo) {
    const cache = {}, cacheUso = {};
    const uso = (id) => (id in cacheUso ? cacheUso[id] : (cacheUso[id] = C.hayUso ? usoDe(c, id) : null));
    const tiene = (id) => (cache[id] = cache[id] || (capPorId[id] ? evaluar(c, capPorId[id]) : { ok: false }));
    for (const id of Object.keys(capPorId)) {
      const t = tiene(id);
      if (!t.ok) continue;
      cuentasPorCap[id] = (cuentasPorCap[id] || 0) + 1;
      if (uso(id)) usoPorCap[id] = (usoPorCap[id] || 0) + 1;
      const m = rolesPorCap[id] = rolesPorCap[id] || {};
      for (const r of t.roles) m[r] = (m[r] || 0) + 1;
    }
    for (const r of R.reglas) {
      if (r.estado === 'descartada') continue;
      const a = tiene(r.a);
      if (!a.ok) continue;
      if (r.tipo === 'sod') { const b = tiene(r.b); if (!b.ok) continue; hallazgos.push({ r, c, ev: [[r.a, a.via], [r.b, b.via]], uso: [[r.a, uso(r.a)], [r.b, uso(r.b)]] }); }

    }
  }
  for (const x of hallazgos) { const u = x.uso.filter(([, v]) => v).length; x.usoNivel = !C.hayUso ? '' : u === x.uso.length ? 'total' : u ? 'parcial' : 'sin'; }
  return { hallazgos, capPorId, cuentasPorCap, rolesPorCap, usoPorCap };

      <p class="t2" style="margin:0 0 6px">${h(capNombre(reg.a))}${reg.tipo === 'sod' ? ` <b>+</b> ${h(capNombre(reg.b))}` : ''} — ${h(reg.desc || '')}</p>

// Historial: "foto" compacta de cada extracción (universo, roles vigentes y hallazgos).
function fotoActual() {
  const C = S.calc;
  const hs = C.riesgos ? C.riesgos.hallazgos : [];
  const cuentas = {};
  for (const c of C.universo) cuentas[c.bname] = { n: c.nombre, p: c.pais, u: c.utilizable ? 1 : 0, b: c.bloqueada ? 1 : 0, r: c.vigentes };
  return {
    id: 'F' + Date.now(), fechaExtraccion: S.fechaRef, guardado: new Date().toISOString(), por: S.param.responsable || '',
    resumen: { cuentasUSR02: C.cuentas.length, universo: C.universo.length, uy: C.universo.filter((c) => c.pais.includes('UY')).length, cl: C.universo.filter((c) => c.pais.includes('CL')).length, hallazgos: hs.length, alta: hs.filter((x) => x.r.severidad === 'alta').length },
    cuentas, hallazgos: hs.map((x) => `${x.r.id}|${x.c.bname}`), reglas: Object.fromEntries(S.riesgos.reglas.map((r) => [r.id, r.nombre])),
  };
}
function compararFotos(a, b) {
  const ka = new Set(Object.keys(a.cuentas)), kb = new Set(Object.keys(b.cuentas));
  const entran = [...kb].filter((k) => !ka.has(k)).sort(), salen = [...ka].filter((k) => !kb.has(k)).sort();
  const cambios = [];
  for (const k of [...kb].filter((x) => ka.has(x)).sort()) {
    const x = a.cuentas[k], y = b.cuentas[k];
    const ra = new Set(x.r), rb = new Set(y.r);
    const mas = y.r.filter((r) => !ra.has(r)), menos = x.r.filter((r) => !rb.has(r));
    const estado = x.b !== y.b ? (y.b ? 'Se bloqueó' : 'Se desbloqueó') : '';
    if (mas.length || menos.length || estado) cambios.push({ k, nombre: y.n, mas, menos, estado });
  }
  const ha = new Set(a.hallazgos), hb = new Set(b.hallazgos);
  return { entran, salen, cambios, nuevos: b.hallazgos.filter((x) => !ha.has(x)), resueltos: a.hallazgos.filter((x) => !hb.has(x)) };
}

  let comp = '';

    const d = compararFotos(fa, fb);

// ------------------------------------------------- vista: parametrización
const tagDef = (p) => (p === 'UY' || p === 'CL' || p === 'AR' ? tagPais(p) : `<span class="tag"><i></i>${PAISES[p] || p}</span>`);
const grupoTipo = (t) => (t === 'contiene' ? 'token' : t);
function filtrarCatalogo() {
  const U = S.ui;
  let l = S.calc ? S.calc.catalogo : [];
  if (U.pUso === 'conuso') l = l.filter((x) => x.usuarios > 0 || x.def);
  if (U.pEstado === 'sinconfirmar') l = l.filter((x) => !x.def);
  else if (U.pEstado === 'confirmados') l = l.filter((x) => x.def);
  else if (U.pEstado === 'difiere') l = l.filter((x) => x.def && x.prop && x.def.pais !== x.prop.pais);
  if (U.pTipo) l = l.filter((x) => grupoTipo(x.tipo) === U.pTipo);
  if (U.pCampo) l = l.filter((x) => x.campo === U.pCampo);
  if (U.pOrigen) l = l.filter((x) => (x.prop ? x.prop.o : 'ninguna') === U.pOrigen);
  if (U.pPais) l = l.filter((x) => (x.def ? x.def.pais : x.prop ? x.prop.pais : '') === U.pPais);
  if (U.pTexto) { const t = U.pTexto.toUpperCase(); l = l.filter((x) => x.valor.includes(t) || x.campo.includes(t) || x.ejemplos.some((e) => e.includes(t))); }
  return l;
}
// Ayuda para decidir: de qué país son (por su nombre) los roles que tienen el valor, y qué otros valores lo acompañan.
function contextoOrg(x) {
  if (x.tipo !== 'org' || !x.porNombre) return '';
  const et = { UY: 'UY', CL: 'CL', AR: 'AR', MULTI: 'varios países', '': 'sin país en el nombre' };
  const dist = Object.entries(x.porNombre).sort((a, b) => b[1] - a[1]).map(([p, k]) => `${n(k)} ${et[p] || p}`).join(' · ');
  const acomp = (x.acompanan || []).map((o) => `${h(o.v)}${o.pais ? ` <span class="muted">(${h(o.pais)})</span>` : ''}`).join(', ');
  return `<div class="t2" style="font-family:inherit;margin-top:6px">Roles según su nombre: ${dist}${acomp ? `<br>Suele estar junto a: <span class="mono">${acomp}</span>` : ''}</div>`;
}

function vistaConsulta() {
  const C = S.calc, U = S.ui, q = U.qCodigo.trim().toUpperCase();
  let res = '';
  if (q) {
    let porRol = {};
    if (U.qModo === 'fiori') { /* se resuelve abajo */ }
    else if (U.qModo === 'tx') {
      for (const agr of Object.keys(C.rolesTodos)) {
        const menu = (C.txMenu[agr] || []).some((t) => t.tcode === q);
        const aut = (C.stcode[agr] || []).filter((v) => coincide(q, v));
        if (menu || aut.length) porRol[agr] = `${menu ? 'Menú' : ''}${menu && aut.length ? ' + ' : ''}${aut.length ? 'S_TCODE ' + aut.map((v) => (v.high ? `${v.low}–${v.high}` : v.low)).join(', ') : ''}`;
      }
    } else {
      const campo = U.qCampo.trim().toUpperCase(), valor = U.qValor.trim().toUpperCase();
      for (const agr of Object.keys(C.rolesTodos)) {
        const filas = (C.autRol[agr] || []).filter((x) => x.obj === q && (!campo || x.campo === campo) && (!valor || x.low === '*' || coincide(valor, x)));
        if (filas.length) porRol[agr] = filas.slice(0, 6).map((x) => `${x.campo}=${x.high ? x.low + '–' + x.high : x.low}`).join(', ') + (filas.length > 6 ? '…' : '');
      }
    }
    if (U.qModo === 'fiori') {
      const t = q;
      for (const agr of Object.keys(C.rolesTodos)) {
        const f = C.fioriRol[agr] || { catalogos: [] }, hits = [];
        for (const cat of f.catalogos) {
          if (cat.toUpperCase().includes(t) || (C.tituloCatalogo[cat] || '').toUpperCase().includes(t)) hits.push('catálogo ' + cat);
          for (const a of C.appsDeCatalogo(cat)) if (a.titulo.toUpperCase().includes(t) || `${a.so}-${a.sa}`.toUpperCase().includes(t) || a.destino.toUpperCase().includes(t)) hits.push(`${a.titulo} (${cat})`);
        }
        for (const sv of C.serviciosRol[agr] || []) if (sv.toUpperCase().includes(t)) hits.push('servicio ' + sv);
        if (hits.length) porRol[agr] = [...new Set(hits)].slice(0, 4).join(', ') + (hits.length > 4 ? '…' : '');
      }
    }
    const filas = C.universo.map((c) => ({ c, roles: c.vigentes.filter((r) => porRol[r]) })).filter((x) => x.roles.length);
    const txt = U.qModo === 'tx' ? (C.textoTx[q] || TX_CRITICAS[q] || '') : '';
    res = `<p class="t2" style="margin:8px 0">${U.qModo === 'tx' ? `<b class="mono">${h(q)}</b> ${h(txt)}` : U.qModo === 'fiori' ? `Fiori: <b>${h(q)}</b>` : `Objeto <b class="mono">${h(q)}</b>`}: <b>${n(filas.length)}</b> cuenta(s) del universo, por ${n(Object.keys(porRol).filter((r) => C.rolesTodos[r] && C.rolesTodos[r].enUniverso).length)} rol(es).</p>
      ${filas.length ? `<div class="tabla-wrap" style="max-height:400px"><table class="t"><thead><tr><th>Usuario</th><th>País</th><th>Estado</th><th>Por los roles</th></tr></thead><tbody>
      ${filas.map(({ c, roles }) => `<tr><td><button class="link mono" data-ficha="${h(c.bname)}">${h(c.bname)}</button>${c.nombre ? `<div class="peq t2">${h(c.nombre)}</div>` : ''}</td><td>${c.pais.map(tagPais).join(' ')}</td><td>${tagEstado(c)}</td><td class="peq">${roles.map((r) => `<span class="mono">${h(r)}</span> <span class="muted">${h(porRol[r])}</span>`).join('<br>')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}`;
  }
  return `<div class="card">
    <div class="card-h"><h2>Consulta inversa: ¿quién tiene…?</h2></div>
    <p class="t2 peq" style="margin-top:0">Por transacción: busca en el menú de los roles (AGR_TCODES) y en S_TCODE (AGR_1251), incluidos patrones como Z*. Por objeto: busca el objeto de autorización y, si se indica, el campo y un valor (respeta * y rangos). Por Fiori: busca el texto en títulos de apps, objetos semánticos, destinos, catálogos y nombres de servicios.</p>
    <div class="fila">
      <select class="campo" id="qModo"><option value="tx" ${U.qModo === 'tx' ? 'selected' : ''}>Transacción</option><option value="obj" ${U.qModo === 'obj' ? 'selected' : ''}>Objeto de autorización</option>${C.hayFiori ? `<option value="fiori" ${U.qModo === 'fiori' ? 'selected' : ''}>App / catálogo / servicio Fiori</option>` : ''}</select>
      <input class="campo mono" id="qCodigo" placeholder="${U.qModo === 'tx' ? 'p. ej. ME21N' : U.qModo === 'fiori' ? 'p. ej. Purchase Order, SAP_MM_BC, API_SALES' : 'p. ej. F_BKPF_BUK'}" value="${h(U.qCodigo)}">
      ${U.qModo === 'obj' ? `<input class="campo mono" id="qCampo" placeholder="Campo (opcional), p. ej. BUKRS" value="${h(U.qCampo)}"><input class="campo mono" id="qValor" placeholder="Valor (opcional), p. ej. UY10" value="${h(U.qValor)}">` : ''}
      <button class="btn" data-accion="q-buscar">Buscar</button>
    </div>
    ${res}
  </div>`;
}

const ET_PAIS = (p) => (p === '*' ? 'Todos (*)' : PAISES[p] || p);
function seccionOtroPais(u) {
  const conMaestro = ['T001', 'T001W'].filter((f) => S.datos[f]).length;
  const afectadas = u.filter((c) => c.alcance && c.alcance.fuera.length);
  const sinPais = u.filter((c) => !c.pais.length).length;
  const pares = {};
  for (const c of afectadas) for (const p of c.alcance.fuera) { const k = `${c.pais.join('+')} → ${ET_PAIS(p)}`; pares[k] = (pares[k] || 0) + 1; }
  const filas = afectadas.slice(0, 200).map((c) => {
    const det = c.alcance.detalle.filter((d) => c.alcance.fuera.includes(d.pais));
    const porPais = {};
    for (const d of det) (porPais[d.pais] = porPais[d.pais] || []).push(d);
    return `<tr><td><button class="link mono" data-ficha="${h(c.bname)}">${h(c.bname)}</button>${c.nombre ? `<div class="peq t2">${h(c.nombre)}</div>` : ''}</td><td>${c.pais.map(tagPais).join(' ')}</td>
      <td class="peq">${Object.entries(porPais).map(([p, ds]) => `<b>${h(ET_PAIS(p))}</b>: <span class="mono">${h([...new Set(ds.map((d) => `${d.campo}=${d.valor}`))].slice(0, 8).join(', '))}${ds.length > 8 ? '…' : ''}</span>`).join('<br>')}</td>
      <td class="mono peq">${h([...new Set(det.flatMap((d) => d.roles))].slice(0, 6).join(', '))}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="card-h"><h2>Acceso a datos de otros países (${n(afectadas.length)} cuenta(s))</h2><button class="btn" data-accion="exportar-otropais">Exportar CSV</button></div>
    <p class="t2 peq" style="margin-top:0">Cruza el país de cada cuenta con el país de las sociedades, centros y organizaciones de sus roles vigentes (AGR_1252). El país de cada valor sale de la parametrización confirmada o, si no está confirmado, de los datos maestros de SAP${conMaestro ? '' : ' <b>(no cargados: cargá T001 y T001W en el paso 1 para tener el país real de sociedades y centros)</b>'}. Es configuración de roles (nivel 1-2): indica a qué datos podría acceder, no que los haya usado.${sinPais ? ` ${n(sinPais)} cuenta(s) del universo no tienen país asignado y no se evalúan.` : ''}</p>
    ${Object.keys(pares).length ? `<p class="peq" style="margin:0 0 8px">${Object.entries(pares).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="tag warn"><i></i>${h(k)}: ${n(v)}</span>`).join(' ')}</p>` : ''}
    ${filas ? `<div class="tabla-wrap" style="max-height:420px"><table class="t"><thead><tr><th>Usuario</th><th>País</th><th>Datos de otro país</th><th>Roles que lo dan</th></tr></thead><tbody>${filas}</tbody></table></div>` : '<p class="t2">Ninguna cuenta del universo tiene valores organizativos de otro país.</p>'}
  </div>`;
}
const filasOtroPais = () => S.calc.universo.filter((c) => c.alcance && c.alcance.fuera.length).flatMap((c) => c.alcance.detalle.filter((d) => c.alcance.fuera.includes(d.pais)).map((d) => [c.bname, c.nombre, c.pais.join('+'), ET_PAIS(d.pais), d.campo, d.valor, d.roles.join(', ')]));
function vistaAnalisis() {
  const C = S.calc, U = S.ui, P = S.conf;
  if (!C || !C.universo.length) return '<h1>Análisis</h1><div class="aviso warn"><b>El universo está vacío</b>Definí en el paso 2 qué cuentas incluir.</div>';
  const u = C.universo;
  const uy = u.filter((c) => c.pais.includes('UY') && !c.pais.includes('CL')).length;
  const cl = u.filter((c) => c.pais.includes('CL') && !c.pais.includes('UY')).length;
  const ambos = u.filter((c) => c.pais.length > 1).length;
  const asigVig = u.reduce((a, c) => a + c.vigentes.length, 0);

// Análisis aparte: cuentas FUERA del universo (Argentina, Costa Rica, etc.) cuyos roles alcanzan datos de Uruguay o Chile.

const filasFueraUyCl = (soloUtil, conAst) => S.calc.cuentas.filter((c) => c.alcanceUyCl && c.alcanceUyCl.some((d) => conAst || d.pais !== '*') && (!soloUtil || c.utilizable) && !c.tecnica);
function seccionFueraConUyCl() {
  const U = S.ui, todas = filasFueraUyCl(false, true), lista = filasFueraUyCl(U.fSoloUtil !== false, !!U.fConAst);
  const especificas = (c) => c.alcanceUyCl.filter((d) => d.pais !== '*');
  const conEspecificas = filasFueraUyCl(U.fSoloUtil !== false, false).length, soloAst = filasFueraUyCl(U.fSoloUtil !== false, true).length - conEspecificas;
  const filas = lista.sort((a, b) => especificas(b).length - especificas(a).length || a.bname.localeCompare(b.bname)).slice(0, 300).map((c) => {

    return `<tr><td><button class="link mono" data-ficha="${h(c.bname)}">${h(c.bname)}</button>${c.nombre ? `<div class="peq t2">${h(c.nombre)}</div>` : ''}</td><td>${tagEstado(c)}</td><td class="peq">${h(c.final === 'excluir' ? 'Excluida' : 'Por revisar')}${c.manual ? ' (manual)' : ''}</td>

const CLAVE_LOGO = 'sapac.scienza.logo.v1';
function pintarLogo() {
  const el = document.getElementById('logo');
  if (!el) return;
  const img = leerLocal(CLAVE_LOGO, '');
  const html = img ? `<img src="${h(img)}" alt="Scienza">` : '<b style="font-size:20px;letter-spacing:.5px;font-weight:700">scienza</b>';
  if (el.innerHTML !== html) el.innerHTML = html;
}
function cargarLogo(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return alert('Elegí una imagen (PNG, JPG o SVG).');
  if (file.size > 400000) return alert('La imagen supera 400 KB: usá una versión más liviana del logo.');
  const fr = new FileReader();
  fr.onload = () => { guardarLocal(CLAVE_LOGO, fr.result); render(); };
  fr.readAsDataURL(file);
}
function statIr(e, v, d, tab, tono) {

}

// Transacciones de una cuenta: unión del menú de sus roles vigentes y de los
// códigos exactos autorizados por S_TCODE; los patrones (Z*, rangos) se listan aparte.
// Lo que el usuario dejó registrado en documentos (tablas de evidencia de uso).
function seccionUso(c) {
  const C = S.calc;
  if (!C.hayUso) return '';
  const ev = (C.usoUsr[c.bname] || []).slice().sort((a, b) => b.n - a.n);
  const autorizada = (t) => c.perfilesDirectos.includes('SAP_ALL') || c.vigentes.some((agr) => (C.stcode[agr] || []).some((v) => coincide(t, v)));
  return `<div class="card"><h2>Evidencia de uso (${n(ev.reduce((a, x) => a + x.n, 0))} documentos)</h2>
    ${ev.length ? `<div class="tabla-wrap" style="max-height:300px"><table class="t"><thead><tr><th>Transacción</th><th>Tabla</th><th class="num">Documentos</th><th>Desde</th><th>Hasta</th><th>Autorizada hoy</th></tr></thead><tbody>
      ${ev.map((x) => `<tr><td><span class="mono">${h(x.tcode || '—')}</span>${C.textoTx[x.tcode] ? ` <span class="peq t2">${h(C.textoTx[x.tcode])}</span>` : ''}${x.clase ? `<div class="peq t2">Clase ${h(x.clase)}</div>` : ''}</td><td class="mono peq">${h(x.tabla)}</td><td class="num">${n(x.n)}</td><td class="peq">${fmtFecha(x.desde)}</td><td class="peq">${fmtFecha(x.hasta)}</td><td class="peq">${!x.tcode || !C.hayTx ? '—' : autorizada(x.tcode) ? 'Sí' : '<span class="tag warn"><i></i>No</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="t2" style="margin:0">No dejó documentos en las tablas cargadas.</p>'}
    <p class="t2 peq" style="margin:6px 0 0">Período: ${h(textoPeriodoUso())}. "Autorizada hoy: No" puede indicar un permiso ya quitado, una transacción llamada desde otra o un registro hecho por un proceso de fondo.</p>
  </div>`;
}
function seccionTransacciones(c) {
  const C = S.calc, tx = {}, patrones = [];
  for (const agr of c.vigentes) {
    for (const t of C.txMenu[agr] || []) (tx[t.tcode] = tx[t.tcode] || { menu: new Set(), aut: new Set(), tipo: t.tipo }).menu.add(agr);
    for (const v of C.stcode[agr] || []) {
      if (!v.high && !v.low.includes('*')) (tx[v.low] = tx[v.low] || { menu: new Set(), aut: new Set() }).aut.add(agr);
      else patrones.push({ v, agr });
    }
  }
  for (const [codigo, x] of Object.entries(tx)) for (const p of patrones) if (coincide(codigo, p.v)) x.aut.add(p.agr);
  const filas = Object.entries(tx).sort((a, b) => (TX_CRITICAS[b[0]] ? 1 : 0) - (TX_CRITICAS[a[0]] ? 1 : 0) || a[0].localeCompare(b[0]));
  return `<div class="card"><h2>Transacciones (${n(filas.length)})</h2>
    ${c.rolesTodasTx.length ? `<div class="aviso crit"><b>Todas las transacciones</b>S_TCODE = * en ${h(c.rolesTodasTx.join(', '))}.</div>` : ''}
    ${patrones.length ? `<p class="t2 peq">Patrones autorizados en S_TCODE: ${h([...new Set(patrones.map((p) => p.v.high ? `${p.v.low}–${p.v.high}` : p.v.low))].join(', '))}</p>` : ''}
    <div class="tabla-wrap" style="max-height:420px"><table class="t"><thead><tr><th>Transacción</th><th>Descripción</th><th>En el menú de</th><th>Autorizada (S_TCODE)</th></tr></thead><tbody>
    ${filas.map(([codigo, x]) => `<tr><td class="mono">${h(codigo)} ${TX_CRITICAS[codigo] ? '<span class="tag warn"><i></i>Crítica</span>' : ''}${x.tipo === 'OT' ? ' <span class="tag"><i></i>Otro objeto</span>' : ''}</td><td class="peq">${h(C.textoTx[codigo] || TX_CRITICAS[codigo] || '')}</td><td class="mono peq">${h([...x.menu].join(', ')) || '<span class="muted">—</span>'}</td><td class="peq">${x.aut.size ? `Sí <span class="mono muted">${h([...x.aut].slice(0, 3).join(', '))}${x.aut.size > 3 ? '…' : ''}</span>` : (C.stcode && Object.keys(C.stcode).length ? '<span class="tag warn"><i></i>No en S_TCODE</span>' : '—')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin transacciones.</td></tr>'}
    </tbody></table></div></div>`;
}
function seccionFiori(roles, titulo) {
  const C = S.calc;

  const grupos = [...new Set(roles.flatMap((r) => (C.fioriRol[r] || { grupos: [] }).grupos))].sort();
  const apps = {};
  for (const cat of cats) for (const a of C.appsDeCatalogo(cat)) { const k = `${a.so}-${a.sa}|${a.destino}`; (apps[k] = apps[k] || Object.assign({ cats: new Set() }, a)).cats.add(cat); }
  const servicios = [...new Set(roles.flatMap((r) => [...(C.serviciosRol[r] || [])]))].sort();
  const sinContenido = cats.filter((c) => !(C.chipsCat[c] || []).length);
  const lista = Object.values(apps).sort((a, b) => a.titulo.localeCompare(b.titulo));
  return `<div class="card"><h2>${titulo} (${n(cats.length)} catálogos, ${n(lista.length)} apps, ${n(servicios.length)} servicios)</h2>
    ${cats.length ? `<p class="peq" style="margin:0 0 6px"><b>Catálogos:</b> ${cats.map((c) => `<span class="mono">${h(c)}</span>${C.tituloCatalogo[c] ? ` <span class="t2">${h(C.tituloCatalogo[c])}</span>` : ''}`).join(' · ')}</p>` : '<p class="t2 peq" style="margin:0 0 6px">Sin catálogos Fiori en el menú de sus roles.</p>'}
    ${grupos.length ? `<p class="peq t2" style="margin:0 0 6px"><b>Grupos:</b> ${h(grupos.join(', '))}</p>` : ''}
    ${sinContenido.length ? `<p class="peq" style="margin:0 0 6px"><span class="tag warn"><i></i>Sin contenido cargado</span> ${h(sinContenido.join(', '))} (${S.datos.PB_C_CHIP && S.datos.PB_C_CHIP.meta.partes > 1 ? 'no figuran en PB_C_CHIP ni en PB_C_CHIPM: pueden no existir en el sistema o estar vacíos' : 'si son catálogos propios, su contenido está en /UI2/PB_C_CHIPM'})</p>` : ''}
    ${lista.length ? `<div class="tabla-wrap" style="max-height:340px"><table class="t"><thead><tr><th>App</th><th>Objeto semántico</th><th>Tipo</th><th>Destino</th><th>Catálogo</th></tr></thead><tbody>
      ${lista.map((a) => `<tr><td>${h(a.titulo)}${a.tipo === 'Transacción' && TX_CRITICAS[a.destino] ? ' <span class="tag warn"><i></i>Crítica</span>' : ''}</td><td class="mono peq">${h(a.so)}-${h(a.sa)}</td><td class="peq">${h(a.tipo)}</td><td class="mono peq">${h(a.destino)}</td><td class="mono peq">${h([...a.cats].join(', '))}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
    ${servicios.length ? `<details class="peq" style="margin-top:8px"><summary><b>Servicios autorizados por S_SERVICE (${n(servicios.length)})</b></summary><p class="mono">${h(servicios.join(', '))}</p></details>` : ''}
    <p class="t2 peq" style="margin:6px 0 0">Una app en el catálogo no alcanza para usarla: también hacen falta su servicio (S_SERVICE) y, si lleva a una transacción, S_TCODE y los objetos que la transacción chequea.</p>
  </div>`;

// Lista de roles que tienen una parte del nombre, para revisar uno por uno si el país del nombre es correcto.

      <td>${org.length ? org.map(tagPais).join(' ') : '<span class="muted">—</span>'}</td><td>${x.paises.map(tagPais).join(' ') || (x.multi.length ? 'Multipaís' : '<span class="muted">—</span>')}</td>
      <td><select class="campo" data-rol-pais="${h(agr)}" data-volver="${h(valor)}"><option value="">— Sin excepción</option>${Object.entries(PAISES).map(([k, v]) => `<option value="${k}" ${def && def.pais === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td></tr>`;
  }).join('');

// ---------------------------------------------------------------- eventos
async function elegirArchivo(fuente, file, agregar = false) {
  if (!file) return;
  try {
    const a = await leerArchivo(file);
    const punt = a.hojas.map((x) => puntaje(fuente, x.filas[filaEncabezado(fuente, x.filas)] || []));
    const hoja = punt.indexOf(Math.max(...punt));
    const fe = filaEncabezado(fuente, a.hojas[hoja].filas);
    S.pendiente = { fuente, archivo: a, hoja, fe, agregar, mapeo: mapeoDe(fuente, armarTabla(a.hojas[hoja], fe)) };
    validarPendiente();
  } catch (e) {
    S.pendiente = { fuente, archivo: { nombre: file.name, hojas: [{ filas: [] }], sha: '' }, hoja: 0, fe: 0, mapeo: {}, error: e.message || String(e) };
  }
  render();
  document.getElementById('mapeo').scrollIntoView({ behavior: 'smooth' });
}
const ORDEN_NOMBRES = ['T001W', 'TKA02', 'TVKBZ', 'TVKO', 'T024E', 'T001', 'AGR_BUFFI', 'AGR_HIER', 'PB_C_CHIP', 'USOBHASH', 'AGR_USERS', 'AGR_1252', 'AGR_1251', 'AGR_TCODES', 'AGR_DEFINE', 'AGR_TEXTS', 'AGR_AGRS', 'AGR_FLAGS', 'AGR_PROF', 'USREFUS', 'USR02', 'USR05', 'USR21', 'UST04', 'ADRP', 'TSTCT'];
// Orden de procesamiento: las tablas que filtran a otras van primero.
const ORDEN_CARGA = ['T001', 'T001W', 'TVKO', 'T024E', 'TKA02', 'TVKBZ', 'USR02', 'AGR_USERS', 'USR21', 'ADRP', 'USR05', 'UST04', 'USREFUS', 'AGR_1252', 'AGR_DEFINE', 'AGR_TEXTS', 'AGR_AGRS', 'AGR_FLAGS', 'AGR_PROF', 'AGR_TCODES', 'AGR_1251', 'TSTCT', 'AGR_BUFFI', 'AGR_HIER', 'PB_C_CHIP', 'USOBHASH', 'USO'];
const fuentePorNombre = (nombre) => { const up = nombre.toUpperCase(); return ORDEN_NOMBRES.find((f) => up.includes(f) || up.includes(f.replace('_', ''))) || (tablaUso(nombre) ? 'USO' : null); };
function detectarFuente(nombre, archivo) {
  if (/(^|[^A-Z])ADRC([^A-Z]|$)/i.test(nombre)) return null; // no se usa (ver mensaje en la carga)
  const porNombre = fuentePorNombre(nombre);
  if (porNombre) return porNombre;
  // Por encabezados: al menos 2 reconocidos y todas las columnas obligatorias de la tabla.
  let mejor = null, p = 1;
  for (const f of Object.keys(FUENTES)) {
    const oblig = FUENTES[f].campos.filter((c) => c[2]).map((c) => c[0]);
    for (const hj of archivo.hojas) {
      const fila = hj.filas[filaEncabezado(f, hj.filas)] || [];
      const vistos = new Set(fila.map((c) => sugerirCampo(f, txt(c))).filter(Boolean));
      if (vistos.size > p && oblig.every((c) => vistos.has(c))) { p = vistos.size; mejor = f; }
    }
  }
  return mejor;
}
async function cargarVarios(files) {
  S.lote = [];
  S.pendiente = null;
  const orden = (f) => { const i = ORDEN_CARGA.indexOf(fuentePorNombre(f.name)); return i < 0 ? 99 : i; };
  const lista = [...files].sort((a, b) => orden(a) - orden(b) || a.name.localeCompare(b.name));
  const enEsteLote = new Set();
  let i = 0;
  for (const file of lista) {
    const item = { nombre: file.name, fuente: null, ok: false, msg: '' };
    S.lote.push(item);
    S.cargando = `Procesando ${++i} de ${lista.length}: ${file.name}…`;
    render();
    await new Promise((r) => setTimeout(r, 30)); // deja que se vea el progreso
    try {
      const a = await leerArchivo(file);
      item.archivo = a;
      const f = detectarFuente(file.name, a);
      if (!f) { item.msg = /ADRC/i.test(file.name) ? 'ADRC no se usa: la dirección de empresa es la misma para todos los usuarios, no indica país' : 'No se reconoció la tabla'; continue; }
      item.fuente = f;
      const punt = a.hojas.map((x) => puntaje(f, x.filas[filaEncabezado(f, x.filas)] || []));
      const hoja = punt.indexOf(Math.max(...punt));
      const fe = filaEncabezado(f, a.hojas[hoja].filas);
      const mapeo = mapeoDe(f, armarTabla(a.hojas[hoja], fe));
      Object.assign(item, { hoja, fe, mapeo });
      const r = procesar(f, armarTabla(a.hojas[hoja], fe), mapeo);
      // Varias partes de la misma tabla en un mismo lote (p. ej. AGR_1251_1, _2, _3) se suman.
      S.pendiente = { fuente: f, archivo: a, hoja, fe, mapeo, resultado: r, agregar: enEsteLote.has(f) };
      confirmarPendiente(false);
      enEsteLote.add(f);
      Object.assign(item, { ok: true, filas: r.regs.length, parte: S.datos[f].meta.partes > 1 ? S.datos[f].meta.partes : 0 });
      item.archivo = null; // liberar memoria: el archivo leído ya no hace falta
    } catch (e) {
      item.msg = e.message || String(e);
    }
  }
  S.pendiente = null;
  S.cargando = '';
  recalcular();
}
function validarPendiente() {
  const P = S.pendiente;
  P.error = null; P.resultado = null;
  try { P.resultado = procesar(P.fuente, armarTabla(P.archivo.hojas[P.hoja], P.fe), P.mapeo); }
  catch (e) { P.error = e.message || String(e); }
}
function confirmarPendiente(redibujar = true) {
  const P = S.pendiente, r = P.resultado;
  const previo = S.datos[P.fuente];
  if (P.fuente === 'USO') { const t = tablaUso(P.archivo.nombre) || 'OTRA'; for (const x of r.regs) x.tabla = t; }
  if (P.agregar && previo) {
    // Suma una parte más de la misma tabla.
    for (const x of r.regs) previo.regs.push(x);
    const m = previo.meta;
    Object.assign(m, { archivo: `${m.archivo}, ${P.archivo.nombre}`, sha: `${m.sha}, ${P.archivo.sha}`, leidas: m.leidas + r.leidas, rechazadas: m.rechazadas + r.rechazadas, duplicadas: m.duplicadas + r.duplicadas,
      adv: [...m.adv, ...[...P.archivo.adv, ...r.adv].map((a) => `${P.archivo.nombre}: ${a}`)], partes: (m.partes || 1) + 1, cargado: new Date().toLocaleString('es-UY') });
  } else {
    S.datos[P.fuente] = { regs: r.regs, meta: { archivo: P.archivo.nombre, sha: P.archivo.sha, leidas: r.leidas, rechazadas: r.rechazadas, duplicadas: r.duplicadas, adv: [...P.archivo.adv, ...r.adv], partes: 1, cargado: new Date().toLocaleString('es-UY') } };
  }
  // Si vino de "Revisar columnas" en la carga múltiple, se actualiza esa fila del resultado.
  if (P.loteIdx != null && S.lote[P.loteIdx]) Object.assign(S.lote[P.loteIdx], { ok: true, msg: '', fuente: P.fuente, filas: S.datos[P.fuente].regs.length, archivo: null });
  S.pendiente = null;
  if (redibujar) recalcular();
}
function decidir(bnames, d, pais) {
  const ahora = new Date().toISOString();
  for (const b of bnames) {
    if (d === '' && !pais) delete S.conf.decisiones[b];
    else S.conf.decisiones[b] = Object.assign({}, S.conf.decisiones[b], { d, pais: pais !== undefined ? pais : (S.conf.decisiones[b] || {}).pais, fecha: ahora });
  }
  guardarConf();
  recalcular();
}

  const SOC = { UY: 'UY01', CL: 'CL01', AR: 'AR01' };
  const ref = '2026-10-20';
  const f8 = (d) => d.toISOString().slice(0, 10).replace(/-/g, '');
  const off = (k) => { const d = new Date(ref + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return d; };
  const usr = [['BNAME', 'USTYP', 'UFLAG', 'GLTGV', 'GLTGB', 'TRDAT', 'LTIME', 'CLASS']];
  const agr = [['UNAME', 'AGR_NAME', 'FROM_DAT', 'TO_DAT', 'COL_FLAG', 'ORG_FLAG']];
  const u21 = [['BNAME', 'PERSNUMBER']], adrp = [['PERSNUMBER', 'NAME_TEXT']], u05 = [['BNAME', 'PARID', 'PARVA']], u04 = [['BNAME', 'PROFILE']];

      if (r() < 0.1) u05.push([b, 'BUK', SOC[pais]]);
      u05.push([b, 'SD_VARIANT_MAINTAIN', 'X']);
      u04.push([b, `T-SE${String(Math.floor(r() * 99999999)).padStart(8, '0')}`]);
      if (r() < 0.04) u04.push([b, 'SAP_ALL']);
      const clase = r() < 0.6 ? `SCIENZA_${pais}` : 'SCIENZA';
      usr.push([b, 'A', r() < 0.05 ? '64' : '0', f8(off(-Math.floor(200 + r() * 2000))), r() < 0.05 ? f8(off(-30)) : '99991231', r() < 0.05 ? '00000000' : f8(off(-Math.floor(r() < 0.15 ? 100 + r() * 300 : r() * 30))), '093000', clase]);
      const mods = Object.keys(MOD);
      const n1 = 2 + Math.floor(r() * 5);
      const asign = new Set(['Z_COMUN_LAUNCHPAD']);
      for (let k = 0; k < n1; k++) { const m = el(mods); const rol = pais === 'CL' ? `ZCL_${m}_${el(MOD[m])}` : `Z${pais}_${m}_${el(MOD[m])}`; asign.add(rol); }
      if (pais === 'UY' && r() < 0.12) asign.add(`ZCL_SD_${el(MOD.SD)}`); // opera también en Chile
      if (pais !== 'AR' && r() < 0.05) asign.add(`ZAR_FI_${el(MOD.FI)}`); // pista mixta
      if (r() < 0.2) asign.add(`Z_${el(mods)}_REPORTES_GLOBAL`); // rol sin país
      for (const rol of asign) { roles.add(rol); agr.push([b, rol, f8(off(-400)), r() < 0.05 ? f8(off(-20)) : '99991231', '', '']); }
    }
  }
  for (const [b, t] of [['RFC_INTEGRA', 'C'], ['BATCH_JOBS', 'B'], ['WF-BATCH', 'B'], ['SOPORTE_EXT', 'A'], ['CONSULTOR01', 'A']]) {
    usr.push([b, t, '0', '20200101', '99991231', t === 'A' ? f8(off(-3)) : '00000000', '', 'TECNICOS']);
    agr.push([b, 'Z_BC_SOPORTE', '20200101', '99991231', '', '']); roles.add('Z_BC_SOPORTE');
  }
  const org = [['AGR_NAME', 'VARBL', 'LOW', 'HIGH']];
  for (const rol of roles) {
    const m = /^Z(UY|CL|AR)_/.exec(rol);
    if (m) org.push([rol, '$BUKRS', SOC[m[1]], '']);
    else if (rol.includes('GLOBAL')) Object.values(SOC).forEach((v) => org.push([rol, '$BUKRS', v, '']));
  }
  const csv = (x) => x.map((f) => f.join(';')).join('\n');
  return { USR02: csv(usr), AGR_USERS: csv(agr), AGR_1252: csv(org), USR21: csv(u21), ADRP: csv(adrp), USR05: csv(u05), UST04: csv(u04), ref };
}
async function cargarDemo() {
  const d = generarDemo();
  for (const f of ['USR02', 'AGR_USERS', 'AGR_1252', 'USR21', 'ADRP', 'USR05', 'UST04']) {
    const filas = leerTexto(d[f]);
    const fe = filaEncabezado(f, filas);
    const tabla = armarTabla({ filas }, fe);
    const r = procesar(f, tabla, mapeoDe(f, tabla));
    S.datos[f] = { regs: r.regs, meta: { archivo: `demo_${f}.csv`, sha: await sha256(new TextEncoder().encode(d[f])), leidas: r.leidas, rechazadas: r.rechazadas, duplicadas: r.duplicadas, adv: r.adv, cargado: new Date().toLocaleString('es-UY') } };
  }
  S.fechaRef = d.ref;
  S.demo = true;
  recalcular();
}

// Estado guardado (parametrización, universo, reglas): se vuelve a leer cuando llega la base de Sheets.
function inicializarEstado() {
  S.conf = Object.assign({ decisiones: {}, excluirTecnicas: true, umbralRoles: 25, diasSinAcceso: 90 }, leerLocal(CLAVE_CONF, {}));
  delete S.conf.reglas;
  const x = cargarParam(); S.param = x.p; S.paramOrigen = x.origen;
  S.riesgos = cargarRiesgos();
}
function arrancar() {
  if (!window.Papa || !window.XLSX) {
    document.getElementById('app').innerHTML = '<div class="aviso crit"><b>No se pudieron cargar las librerías de lectura</b>Esta página necesita acceso a cdnjs.cloudflare.com para leer CSV y Excel. Verificá la conexión o el proxy.</div>';
  } else {
    recalcular();
  }
  pintarSync();
}
function iniciarConBase(r) {
  Object.assign(SYNC, { estado: 'ok', url: r.url, nombre: r.nombre, ultimo: Object.values(r.actualizado || {}).sort().pop() || '' });
  Object.assign(ALMACEN, r.datos || {});
  // Primera vez: lo que estaba guardado en este navegador se sube a la base.
  const migradas = [];
  for (const k of [CLAVE_CONF, CLAVE_PARAM, CLAVE_RIESGOS, CLAVE_HISTORIAL, CLAVE_LOGO]) {
    let local = null;
    try { local = localStorage.getItem(k); } catch (e) { local = null; }
    if (!ALMACEN[k] && local) { ALMACEN[k] = local; programarGuardado(k, 300); migradas.push(k); }
  }
  inicializarEstado();
  arrancar();
  if (migradas.length) setTimeout(() => alert(`Se copiaron a la base de Google Sheets las definiciones que estaban guardadas en este navegador (${migradas.length} bloque(s)).`), 200);
}
function errorBase(e) {
  SYNC.estado = 'error-carga'; SYNC.error = (e && e.message) || String(e);
  for (const k of [CLAVE_CONF, CLAVE_PARAM, CLAVE_RIESGOS, CLAVE_HISTORIAL, CLAVE_LOGO]) { try { const v = localStorage.getItem(k); if (v) ALMACEN[k] = v; } catch (x) { /* sin almacenamiento */ } }
  inicializarEstado();
  arrancar();
  document.getElementById('app').insertAdjacentHTML('afterbegin', `<div class="aviso crit"><b>No se pudo leer la base de datos de Google Sheets</b>${h(SYNC.error)}<br>Se muestra la última copia de este navegador y los cambios <b>no</b> se guardan en Sheets. <button class="btn mini" data-accion="recargar">Reintentar</button></div>`);
}
if (EN_GAS) {
  pintarSync();
  document.getElementById('app').innerHTML = '<div class="aviso"><b>Leyendo la base de datos…</b>Abriendo la hoja de cálculo con tus definiciones guardadas.</div>';
  google.script.run.withSuccessHandler(iniciarConBase).withFailureHandler(errorBase).cargarTodo();
} else {
  S.riesgos = cargarRiesgos();
  arrancar();
}
window.__listo = true;
</script>
